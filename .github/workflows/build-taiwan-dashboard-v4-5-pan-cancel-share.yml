name: Build NaviPilot Taiwan Dashboard v4.5 (map pan + cancel route + Google share)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout NaviPilot source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android toolchains
        shell: bash
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Recreate exact approved v4.1 base from repository
        shell: bash
        env:
          TW_KEYSTORE_B64: ${{ secrets.NAVIPILOT_TW_KEYSTORE_B64 }}
          TW_KEYSTORE_PASSWORD: ${{ secrets.NAVIPILOT_TW_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY_V41_BASE'
          from pathlib import Path
          import hashlib, subprocess, os
          source = Path('.github/workflows/build-taiwan-dashboard-v4-1-permission-wizard.yml')
          if not source.is_file():
              raise SystemExit('Missing v4.1 base YAML in the selected branch. Upload it first.')
          data=source.read_bytes()
          blob_sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\x00'+data).hexdigest()
          expected='a374ac838029faea47294bde9df811438c420d40'
          if blob_sha!=expected:
              raise SystemExit(f'Base v4.1 YAML was modified (SHA {blob_sha}); refusing to run an unreviewed source generator.')
          requested=[
              'Inject independent read-only dashboard',
              'Configure v3.8 map focus, slimmer assets, and stable APK updates',
              'Add v3.9 general GPS accuracy and road speed preview',
              'Make v4.0 map-first interface and Google Maps quick-return',
              'Add v4.1 first-run permission wizard and return check',
          ]
          code={}; current=None; recording=False; buf=[]
          def flush():
              global buf,recording
              if current in requested and recording:
                  if current in code: raise RuntimeError('Duplicate step '+current)
                  code[current]='\n'.join(buf)+'\n'
              buf=[];recording=False
          for line in data.decode('utf-8').splitlines():
              if line.startswith('      - name: '):
                  flush();current=line[len('      - name: '):].strip()
              elif current in requested:
                  if line == '        run: |':
                      recording=True;buf=[]
                  elif recording:
                      if line.startswith('          '): buf.append(line[10:])
                      elif line.strip() == '': buf.append('')
                      else: flush()
          flush()
          assert list(code)==requested, f'Expected five base injections in order, got {list(code)}'
          if not os.environ.get('TW_KEYSTORE_B64') or not os.environ.get('TW_KEYSTORE_PASSWORD'):
              raise SystemExit('Missing fixed signing secrets; see v3.8 one-time signing setup.')
          for name in requested:
              print('Rebuilding approved base step:',name,flush=True)
              subprocess.run(['bash','-e','-o','pipefail'],input=code[name],text=True,env=os.environ.copy(),check=True)
          print('All pinned v4.1 base patches applied. Ready for v4.2 UI patch.')
          PY_V41_BASE

      - name: Add v4.2 fullscreen themes, Carrot zoom, gesture drawer and state feedback
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/navipilot_ui_patch_v42.py <<'PY_V42_PATCH'
          from pathlib import Path
          import re

          src = Path('app/src/main/java/com/jixiexiaoge/drivingassist/TaiwanDashActivity.kt')
          s = src.read_text(encoding='utf-8')

          def one(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise RuntimeError(f'v4.2 patch: expected one {label}; found {count}')
              s = s.replace(old, new, 1)

          one('import android.app.AlertDialog', '''import android.app.AlertDialog
          import android.view.MotionEvent
          import android.widget.FrameLayout
          import kotlin.math.abs''', 'drawer imports')
          one('private lateinit var screen: LinearLayout', '''private lateinit var rootFrame: FrameLayout
              private lateinit var overlayBadge: Button
              private lateinit var drawerHandle: Button
              private var cameraLarge = false
              private var immersiveUi = true
              private var swipeEligible = false
              private var swipeStartX = 0f
              private var swipeStartY = 0f
              private fun layoutPrefs() = getSharedPreferences("navi_taiwan_layout_v42", MODE_PRIVATE)
              private lateinit var screen: LinearLayout''','layout fields')

          one('setContentView(screen)', '''rootFrame = FrameLayout(this).apply {
                      setBackgroundColor(bg)
                      addView(screen, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                  }
                  setContentView(rootFrame)
                  val previousMode = layoutPrefs().getInt("mode", 0)
                  mapOnly = previousMode == 0
                  focused = previousMode == 3
                  cameraLarge = previousMode == 2
                  immersiveUi = layoutPrefs().getBoolean("immersive", true)''', 'root overlay initialization')

          one('// Initial launch: explain missing permissions; never open system Settings without a tap.', '''createOverlayControls()
                  // Initial launch: explain missing permissions; never open system Settings without a tap.''', 'create overlays after panel setup')

          # Override the horizontal and portrait split weights without recreating either WebView.
          one('''content.addView(cameraPanel, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1.15f).apply { rightMargin = dp(5) })
                      content.addView(mapPanel, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f))''','''content.addView(cameraPanel, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, if (cameraLarge) 2.7f else 1.15f).apply { rightMargin = dp(5) })
                      content.addView(mapPanel, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, if (cameraLarge) 1.0f else 1f))''','landscape camera-weighted layout')
          one('''content.addView(cameraPanel, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 0.46f).apply { bottomMargin = dp(5) })
                      content.addView(mapPanel, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 0.54f))''','''content.addView(cameraPanel, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, if (cameraLarge) 0.70f else 0.46f).apply { bottomMargin = dp(5) })
                      content.addView(mapPanel, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, if (cameraLarge) 0.30f else 0.54f))''','portrait camera-weighted layout')

          one('''screen.addView(titleRow)''', '''screen.addView(titleRow)
                  titleRow.visibility = if (immersiveUi) View.GONE else View.VISIBLE''','hide top header in immersive mode')
          one('''screen.addView(footer)
                  updateScreen()''','''screen.addView(footer)
                  footer.visibility = if (immersiveUi) View.GONE else View.VISIBLE
                  applyImmersiveUi()
                  updateScreen()''','hide permanent controls')

          one('''status.text = if (running) "● 運行中" else "○ 已停止"''', '''status.text = if (running) "● 監測中" else "○ 已停止"
                  startBtn.text = if (running) "✓ 已開始" else "▶ 開始"
                  startBtn.isEnabled = !running
                  startBtn.alpha = if (running) 0.70f else 1f
                  stopBtn.text = if (running) "■ 停止" else "✓ 已停止"
                  stopBtn.isEnabled = running
                  stopBtn.alpha = if (running) 1f else 0.65f
                  if (::overlayBadge.isInitialized) {
                      overlayBadge.text = if (running) "● 監測中" else "○ 已停止"
                      overlayBadge.background = shape(if (running) Color.rgb(7, 95, 66) else panelColor)
                  }''','visible monitoring state')

          one('''cameraLive = true
                  mapOnly = false
                  focused = false
                  renderLayout()''','''cameraLive = true
                  val mode = layoutPrefs().getInt("mode", 0)
                  mapOnly = false  // Reveal video once the driver explicitly connects C4.
                  focused = mode == 3
                  cameraLarge = mode == 2
                  renderLayout()''','preserve camera layout choice on C4 connection')

          # On Android rotation and on return from Google Maps, reapply immersive flags.
          one('''override fun onResume() {
                  super.onResume()
                  returnNotificationManager().cancel(4001)''','''override fun onResume() {
                  super.onResume()
                  applyImmersiveUi()
                  returnNotificationManager().cancel(4001)''','resume immersive flags')

          # Start/stop confirmation when user taps the existing buttons. Real state is persisted in TaiwanDashState.
          one('''TaiwanDashState.start(this)
                      startGps()''','''TaiwanDashState.start(this)
                      Toast.makeText(this, "已開始監測", Toast.LENGTH_SHORT).show()
                      startGps()''','start state toast')
          one('''TaiwanDashState.stop(this, reason)
                  returnNotificationManager().cancel(4001)''','''TaiwanDashState.stop(this, reason)
                  if (reason == "user_button") Toast.makeText(this, "已停止監測", Toast.LENGTH_SHORT).show()
                  returnNotificationManager().cancel(4001)''','stop state toast')

          # Drawer, modes, and edge gestures use existing camera/map WebViews: avoid reconnection and avoid intercepting middle-of-map drags.
          injected=r'''
              // ---- v4.2 responsive theme / fullscreen drawer. No car-control messages. ----
              private fun createOverlayControls() {
                  overlayBadge = button("○ 已停止", panelColor) { showQuickControls() }
                  rootFrame.addView(overlayBadge, FrameLayout.LayoutParams(dp(102), dp(39), Gravity.TOP or Gravity.END).apply {
                      topMargin = dp(12)
                      rightMargin = dp(38)
                  })
                  drawerHandle = button("≪", blue) { showQuickControls() }
                  rootFrame.addView(drawerHandle, FrameLayout.LayoutParams(dp(38), dp(81), Gravity.END or Gravity.CENTER_VERTICAL))
                  updateScreen()
              }

              private fun applyImmersiveUi() {
                  window.decorView.systemUiVisibility = if (immersiveUi) (
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                          View.SYSTEM_UI_FLAG_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                          View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      ) else View.SYSTEM_UI_FLAG_VISIBLE
              }

              private fun chooseDisplayMode(newMode: Int) {
                  layoutPrefs().edit().putInt("mode", newMode).apply()
                  mapOnly = newMode == 0
                  focused = newMode == 3
                  cameraLarge = newMode == 2
                  renderLayout() // Re-parent the same WebViews, preserving stream and map position.
                  val label = when (newMode) {
                      0 -> "大地圖主題"
                      1 -> "均衡雙欄主題"
                      2 -> "Carrot 大畫面主題"
                      else -> "Carrot 全螢幕"
                  }
                  Toast.makeText(this, "已切換：$label", Toast.LENGTH_SHORT).show()
              }

              private fun toggleFullscreenUi() {
                  immersiveUi = !immersiveUi
                  layoutPrefs().edit().putBoolean("immersive", immersiveUi).apply()
                  renderLayout()
                  Toast.makeText(this, if (immersiveUi) "已開啟沉浸式全螢幕" else "已顯示標準工具列", Toast.LENGTH_SHORT).show()
              }

              private fun showQuickControls() {
                  val running = TaiwanDashState.enabled(this)
                  val options = arrayOf(
                      if (running) "✓ 正在監測（點選無須重複開始）" else "▶ 開始監測",
                      if (running) "■ 停止監測" else "✓ 已停止監測",
                      "▣ 大地圖主題",
                      "▦ 均衡雙欄主題",
                      "▣ Carrot 大畫面（約 73%）",
                      "⛶ Carrot 全螢幕影像",
                      if (immersiveUi) "顯示標準工具列" else "隱藏工具列／全螢幕",
                      "連接 C4 Carrot Web",
                      "Google 地圖導航",
                      "設定與權限"
                  )
                  val dialog = AlertDialog.Builder(this)
                      .setTitle("NaviPilot · 快速控制")
                      .setItems(options) { _, index ->
                          when (index) {
                              0 -> if (!running) startBtn.performClick()
                              1 -> if (running) stopBtn.performClick()
                              2 -> chooseDisplayMode(0)
                              3 -> chooseDisplayMode(1)
                              4 -> chooseDisplayMode(2)
                              5 -> chooseDisplayMode(3)
                              6 -> toggleFullscreenUi()
                              7 -> connectCarrot()
                              8 -> openGoogleMaps()
                              9 -> showOptions()
                          }
                      }.create()
                  dialog.setOnShowListener {
                      dialog.window?.setGravity(Gravity.BOTTOM)
                      dialog.window?.setLayout(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }
                  dialog.show()
              }

              override fun dispatchTouchEvent(ev: MotionEvent): Boolean {
                  if (!::rootFrame.isInitialized) return super.dispatchTouchEvent(ev)
                  when (ev.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          swipeStartX = ev.x
                          swipeStartY = ev.y
                          swipeEligible = ev.x < dp(26) || ev.x > rootFrame.width - dp(26) || ev.y > rootFrame.height - dp(32)
                      }
                      MotionEvent.ACTION_UP -> {
                          val dx = ev.x - swipeStartX
                          val dy = ev.y - swipeStartY
                          if (swipeEligible && (abs(dx) >= dp(72) || -dy >= dp(62))) {
                              swipeEligible = false
                              showQuickControls()
                              return true
                          }
                          swipeEligible = false
                      }
                      MotionEvent.ACTION_CANCEL -> swipeEligible = false
                  }
                  return super.dispatchTouchEvent(ev)
              }

          '''
          one('    private fun showOptions() {',injected+'    private fun showOptions() {','drawer controls and modes')

          src.write_text(s, encoding='utf-8')

          # Retain stable com.jixiexiaoge.drivingassist.taiwan package and the exact signing key from v3.9 onward.
          gradle=Path('app/build.gradle.kts')
          g=gradle.read_text(encoding='utf-8')
          assert 'applicationIdSuffix = ".taiwan"' in g, 'Stable Taiwan package missing'
          assert 'signingConfig = signingConfigs.getByName("release")' in g, 'Release signing missing'
          old='versionName = "4.1.0-permission-wizard"'
          if g.count(old) != 1:
              raise RuntimeError('v4.1 version anchor changed')
          g=g.replace(old,'versionName = "4.2.0-responsive-themes"',1)
          g, changed=re.subn(r'versionCode = (\d+)',lambda m:f'versionCode = {int(m.group(1))+1_000_000}',g,count=1)
          if changed != 1: raise RuntimeError('Missing versionCode')
          gradle.write_text(g,encoding='utf-8')

          manifest=Path('app/src/debug/AndroidManifest.xml')
          m=manifest.read_text(encoding='utf-8')
          if m.count('NaviPilot Taiwan 4.1')!=1: raise RuntimeError('v4.1 manifest anchor changed')
          manifest.write_text(m.replace('NaviPilot Taiwan 4.1','NaviPilot Taiwan 4.2',1),encoding='utf-8')
          print('v4.2 themes/fullscreen/edge drawer/status feedback installed with stable APK ID/signature')
          PY_V42_PATCH
          python3 -m py_compile /tmp/navipilot_ui_patch_v42.py
          python3 /tmp/navipilot_ui_patch_v42.py

      - name: Add v4.3 live map, route geometry and map rotation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/navipilot_patch_v43.py <<'PY_V43_PATCH'
          from pathlib import Path
          import re
          root = Path('app/src/main/java/com/jixiexiaoge/drivingassist')
          p = root/'TaiwanDashActivity.kt'
          s = p.read_text(encoding='utf-8')
          
          def once(old,new,label):
              global s
              n=s.count(old)
              if n!=1:raise RuntimeError(f'v4.3 anchor {label}: expected 1, found {n}')
              s=s.replace(old,new,1)
          
          once('import android.webkit.WebResourceRequest', 'import android.webkit.JavascriptInterface\nimport android.webkit.WebResourceRequest', 'JS interface import')
          once('import java.net.URL', 'import java.net.URL\nimport java.net.HttpURLConnection\nimport org.json.JSONObject', 'route JSON imports')
          once('private var mapOnly = true // Start with map full screen when C4 is not connected.', '''private var mapOnly = true // Start with map full screen when C4 is not connected.
              // Local-only display state. Routing is requested only after explicit user confirmation.
              private var orientationMode = 0 // 0 north-up; 1 course-up
              private var lastReliableBearing = 0f
              private var routeBusy = false
              private var routeBanner = ""
              private var routeJson: String? = null
              private fun navPrefs() = getSharedPreferences("navi_taiwan_route_v43", MODE_PRIVATE)''', 'orientation and route states')
          
          once('''if (quality.accepted && !quality.stationaryDrift) {
                          lastPosition = Location(location)
                          publishGps(location)
                          updateRoadBadge(location)
                      }''', '''if (quality.accepted && (!quality.stationaryDrift || lastPosition == null)) {
                          lastPosition = Location(location)
                          publishGps(location)
                          publishCourse(location)
                          updateRoadBadge(location)
                      } else if (lastPosition == null && location.hasAccuracy() && location.accuracy <= 150f) {
                          // Show a provisional first fix rather than a blank screen; reject it for speed/route decisions.
                          lastPosition = Location(location)
                          publishGps(location)
                      }''','first fix and heading')
          
          once('''immersiveUi = layoutPrefs().getBoolean("immersive", true)
                  createPanels()''', '''immersiveUi = layoutPrefs().getBoolean("immersive", true)
                  orientationMode = navPrefs().getInt("orientation", 0)
                  createPanels()''', 'orientation preference startup')
          
          once('''            // Identifies the application when requesting OSM tiles; do not prefetch tiles.
                      settings.userAgentString''', '''            // Only the locally authored map HTML may call the narrowly scoped route-point bridge.
                      addJavascriptInterface(RoutePointBridge(), "TaiwanRoutePoint")
                      // Identifies the application when requesting OSM tiles; do not prefetch tiles.
                      settings.userAgentString''', 'add bridge')
          
          once('''                    mapReady = true
                              lastPosition?.let { publishGps(it); updateRoadBadge(it) }''', '''                    mapReady = true
                              map.evaluateJavascript("setOrientationMode($orientationMode)", null)
                              routeJson?.let { map.evaluateJavascript("setRoute($it)", null) }
                              lastPosition?.let { publishGps(it); publishCourse(it); updateRoadBadge(it) }''', 'map ready restore')
          
          once('''        createOverlayControls()
                  // Initial launch''', '''        createOverlayControls()
                  // Always display current location in the foreground; monitoring is independently optional.
                  if (hasPermission()) startGps()
                  // Initial launch''', 'initial location')
          
          once('''            "Google 地圖導航",
                      "設定與權限"''', '''            "Google 地圖導航",
                      "設定與權限",
                      if (orientationMode == 0) "🧭 地圖：北朝上 → 車頭朝上" else "🧭 地圖：車頭朝上 → 北朝上",
                      "📍 設定目的地（長按地圖或輸入座標）",
                      "↻ 手動重新計算路線",
                      "✕ 清除規劃路線"''', 'quick menu extra items')
          
          once('''                    9 -> showOptions()
                          }
                      }.create()''', '''                    9 -> showOptions()
                              10 -> toggleOrientationMode()
                              11 -> showDestinationDialog()
                              12 -> showRecalculatePrompt()
                              13 -> clearRoute()
                          }
                      }.create()''', 'quick menu extra actions')
          
          once('''        val items = arrayOf("更改 C4 IP", "匯入台灣測速 CSV", "下載官方固定測速資料", "檢查 NaviPilot 通知存取權", "開啟 Google 地圖", "分享診斷 Log", "清除舊診斷 Log", "分享 GPS 精度報告", "停車查附近道路速限", "自動速限查詢授權", "權限設定／重新檢查")''', '''        val items = arrayOf("更改 C4 IP", "匯入台灣測速 CSV", "下載官方固定測速資料", "檢查 NaviPilot 通知存取權", "開啟 Google 地圖", "分享診斷 Log", "清除舊診斷 Log", "分享 GPS 精度報告", "停車查附近道路速限", "自動速限查詢授權", "權限設定／重新檢查", "地圖方向：北朝上／車頭朝上", "規劃路線：設定目的地")''', 'settings options')
          
          once('''                10 -> showPermissionWizard(true)
                          6 ->''', '''                10 -> showPermissionWizard(true)
                          11 -> toggleOrientationMode()
                          12 -> showDestinationDialog()
                          6 ->''', 'settings actions')
          
          once('''    private fun startGps() {
                  if (!TaiwanDashState.enabled(this) || gpsStarted) return''', '''    private fun startGps() {
                  if (gpsStarted) return''', 'foreground location independent')
          
          once('''        if (requestCode == 91 && hasPermission()) startGps()''', '''        if ((requestCode == 91 || requestCode == 194) && hasPermission()) startGps()''', 'start map after permission grant')
          
          once('''        if (TaiwanDashState.enabled(this)) startGps()
                  if (cameraLive) connectCarrot()''', '''        if (hasPermission()) startGps()
                  if (cameraLive) connectCarrot()''', 'resume location')
          
          once('''        if (!TaiwanDashState.enabled(this) || !mapReady || !l.latitude.isFinite() || !l.longitude.isFinite()) return''', '''        if (!mapReady || !l.latitude.isFinite() || !l.longitude.isFinite()) return''', 'publish location when stopped')
          
          once('''        if (!running && gpsStarted) stopGps()''', '''        // A stopped monitoring session must NOT stop the foreground GPS map.''', 'keep foreground location')
          
          once('''        TaiwanDashState.stop(this, reason)
                  if (reason == "user_button")''', '''        TaiwanDashState.stop(this, reason)
                  if (reason == "user_button")''', 'stop preserve')
          # The stopEverything function stops GPS; remove this only there.
          once('''        returnNotificationManager().cancel(4001)
                  stopGps()
                  cameraLive = false''', '''        returnNotificationManager().cancel(4001)
                  // Map continues following location until the Activity leaves the foreground.
                  cameraLive = false''','stop monitoring keeps map gps')
          
          once('''        banner.text = if (fresh) "${nav.first}｜${nav.second.take(26)}" else "開啟 Google 地圖開始導航"''', '''        banner.text = if (routeBanner.isNotBlank()) routeBanner else if (fresh) "${nav.first}｜${nav.second.take(26)}" else "長按地圖選目的地，規劃藍色路線"''', 'route banner fallback')
          
          # New code is intentionally read-only and independent of the comma 4 control protocol.
          new_methods=r'''
              // ----- v4.3 map orientation and optional route preview -----
              private fun toggleOrientationMode() {
                  orientationMode = if (orientationMode == 0) 1 else 0
                  navPrefs().edit().putInt("orientation", orientationMode).apply()
                  if (mapReady) map.evaluateJavascript("setOrientationMode($orientationMode)", null)
                  lastPosition?.let { publishCourse(it) }
                  Toast.makeText(this, if (orientationMode == 0) "地圖已固定北方朝上" else "行進方向朝上：移動後開始旋轉", Toast.LENGTH_SHORT).show()
              }
          
              private fun publishCourse(location: Location) {
                  // GPS course becomes unreliable at low speed; hold the last valid bearing.
                  if (location.hasBearing() && location.hasSpeed() && location.speed >= 2.2f &&
                      (!location.hasAccuracy() || location.accuracy <= 35f)) {
                      lastReliableBearing = location.bearing
                  }
                  if (mapReady) map.evaluateJavascript("setHeading(${lastReliableBearing.toDouble()})", null)
              }
          
              private inner class RoutePointBridge {
                  @JavascriptInterface fun selected(lat: Double, lon: Double) {
                      if (!lat.isFinite() || !lon.isFinite() || kotlin.math.abs(lat) > 85 || kotlin.math.abs(lon) > 180) return
                      runOnUiThread { if (!isFinishing && !isDestroyed) confirmRoute(lat, lon) }
                  }
              }
          
              private fun showDestinationDialog() {
                  val input = EditText(this).apply { setSingleLine(true); hint = "緯度,經度，例如 22.997,120.220" }
                  AlertDialog.Builder(this).setTitle("設定目的地")
                      .setMessage("可以直接長按地圖設定，或輸入目的地的緯度,經度。")
                      .setView(input)
                      .setPositiveButton("確認") { _, _ ->
                          val parts = input.text.toString().split(',', '，').map { it.trim() }
                          val lat = parts.getOrNull(0)?.toDoubleOrNull()
                          val lon = parts.getOrNull(1)?.toDoubleOrNull()
                          if (lat == null || lon == null || !lat.isFinite() || !lon.isFinite() || kotlin.math.abs(lat)>85 || kotlin.math.abs(lon)>180) {
                              Toast.makeText(this, "座標格式應為：緯度,經度", Toast.LENGTH_LONG).show()
                          } else confirmRoute(lat, lon)
                      }.setNegativeButton("取消", null).show()
              }
          
              private fun confirmRoute(destLat: Double, destLon: Double) {
                  val start = lastPosition
                  if (start == null || System.currentTimeMillis() - start.time > 120_000L ||
                      !start.hasAccuracy() || start.accuracy > 75f) {
                      Toast.makeText(this, "等待目前定位精度改善後再規劃路線", Toast.LENGTH_LONG).show()
                      return
                  }
                  AlertDialog.Builder(this).setTitle("規劃導航路線（測試）")
                      .setMessage("將目前 GPS 座標與目的地傳給公開 OSRM 試用服務，取得汽車道路路線。這條路線不是 Google Maps 的原路線，服務不保證可用，也不控制 C4。是否繼續？")
                      .setPositiveButton("同意並計算") { _, _ -> fetchRoute(start.latitude, start.longitude, destLat, destLon) }
                      .setNegativeButton("取消", null).show()
              }
          
              private var destPoint: Pair<Double, Double>? = null
              private fun showRecalculatePrompt() {
                  val end=destPoint
                  if(end==null) { Toast.makeText(this, "請先長按地圖設定目的地", Toast.LENGTH_SHORT).show(); return }
                  confirmRoute(end.first,end.second)
              }
          
              private fun fetchRoute(fromLat: Double, fromLon: Double, toLat: Double, toLon: Double) {
                  if (routeBusy) return
                  routeBusy = true
                  Toast.makeText(this, "正在取得路線…", Toast.LENGTH_SHORT).show()
                  thread(name="taiwan-route-preview") {
                      val result = runCatching {
                          val endpoint="https://router.project-osrm.org/route/v1/driving/$fromLon,$fromLat;$toLon,$toLat?overview=full&geometries=geojson&steps=false"
                          val conn=URL(endpoint).openConnection() as HttpURLConnection
                          try {
                              conn.connectTimeout=10000; conn.readTimeout=12000
                              conn.setRequestProperty("Accept", "application/json")
                              conn.setRequestProperty("User-Agent", "NaviPilotTaiwan/4.3 private-routing-preview")
                              if (conn.responseCode != 200) throw IllegalStateException("路線服務 HTTP ${conn.responseCode}")
                              val body=conn.inputStream.bufferedReader().use { it.readText().take(1_600_001) }
                              if(body.length>1_600_000) throw IllegalStateException("路線資料過大")
                              val json=JSONObject(body)
                              if(json.optString("code")!="Ok") throw IllegalStateException("路線服務無法規劃此路線")
                              val route=json.getJSONArray("routes").getJSONObject(0)
                              val geometry=route.getJSONObject("geometry").getJSONArray("coordinates")
                              if(geometry.length()<2 || geometry.length()>18000) throw IllegalStateException("路線座標數量不合理")
                              Triple(geometry.toString(),route.optDouble("distance"),route.optDouble("duration"))
                          } finally { conn.disconnect() }
                      }
                      runOnUiThread {
                          routeBusy = false
                          if (isFinishing || isDestroyed) return@runOnUiThread
                          result.onSuccess { (coords,metres,seconds) ->
                              routeJson=coords
                              destPoint=Pair(toLat,toLon)
                              routeBanner="獨立路線 ${(metres/1000.0).let { String.format(java.util.Locale.US,"%.1f",it) }} km · 約 ${(seconds/60.0).toInt()} 分鐘"
                              if(mapReady) map.evaluateJavascript("setRoute($coords)", null)
                              updateScreen()
                              Toast.makeText(this,"已繪製 OSRM 導航路線",Toast.LENGTH_SHORT).show()
                          }.onFailure { ex ->
                              Toast.makeText(this,"路線規劃失敗：${ex.message.orEmpty().take(85)}",Toast.LENGTH_LONG).show()
                          }
                      }
                  }
              }
          
              private fun clearRoute() {
                  routeJson=null
                  routeBanner=""
                  destPoint=null
                  if(mapReady) map.evaluateJavascript("setRoute([])",null)
                  updateScreen()
              }
          
