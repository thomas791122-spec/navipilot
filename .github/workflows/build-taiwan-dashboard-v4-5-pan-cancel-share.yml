              private fun validPoint(lat: Double, lon: Double): Pair<Double,Double>? =
                  if (lat.isFinite() && lon.isFinite() && lat in -85.0..85.0 && lon in -180.0..180.0)
                      Pair(lat,lon) else null

              // Extract known coordinate-bearing formats. A Google Maps link is not a route API.
              private fun coordinatesInSharedText(raw: String): Pair<Double,Double>? {
                  val text=runCatching { URLDecoder.decode(raw.take(4096).replace("+","%2B"),"UTF-8") }.getOrDefault(raw.take(4096))
                  val number="(-?\\d{1,3}(?:\\.\\d+)?)"
                  fun match(pattern: String): Pair<Double,Double>? {
                      val m=Regex(pattern,RegexOption.IGNORE_CASE).find(text) ?: return null
                      val a=m.groupValues[1].toDoubleOrNull() ?: return null
                      val b=m.groupValues[2].toDoubleOrNull() ?: return null
                      return validPoint(a,b)
                  }
                  return match("!3d$number!4d$number")
                      ?: match("(?:destination|daddr|query|q|ll)=$number,$number")
                      ?: match("(?:geo:|coords:)$number,$number")
                      ?: match("(?<![0-9])$number\\s*,\\s*$number(?![0-9])")
                      ?: match("/@$number,$number") // Last resort: often map centre, may be imprecise.
              }

              private fun resolveSharedPlace(raw: String) {
                  val direct=coordinatesInSharedText(raw)
                  if (direct != null) { showImportedPlace(direct); return }
                  val short=Regex("https?://[^\\s<>\\\"]+", RegexOption.IGNORE_CASE).find(raw)?.value?.trimEnd('.',',',')')
                  val host=runCatching { URI(short).host.orEmpty().lowercase(java.util.Locale.US) }.getOrDefault("")
                  val allowed=host in listOf("maps.app.goo.gl","goo.gl","www.google.com","google.com","maps.google.com","www.google.com.tw")
                  if (short == null || !allowed) {
                      Toast.makeText(this,"分享內容沒有可辨識的座標，請用地圖選點",Toast.LENGTH_LONG).show()
                      return
                  }
                  Toast.makeText(this,"正在辨識 Google Maps 短網址…",Toast.LENGTH_SHORT).show()
                  thread(name="navi-share-link") {
                      val p=runCatching {
                          val conn=URL(short).openConnection() as HttpURLConnection
                          try {
                              conn.instanceFollowRedirects=true
                              conn.connectTimeout=6000;conn.readTimeout=6000
                              conn.setRequestProperty("User-Agent","Mozilla/5.0 NaviPilotTaiwan/4.4")
                              if(conn.responseCode !in 200..399) throw IllegalStateException("Google 分享連結無法展開")
                              val finalUrl=conn.url.toString()
                              val finalHost=URI(finalUrl).host.orEmpty().lowercase(java.util.Locale.US)
