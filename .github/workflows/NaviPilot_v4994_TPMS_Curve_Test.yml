            for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
          function lanePoints(item, w, h) {
            const xs = item && item.x;
            const ys = item && item.y;
            if (!Array.isArray(xs) || !Array.isArray(ys)) return [];
            const out = [];
            for (let i = 0; i < Math.min(xs.length, ys.length); i += 1) {
              const x = number(xs[i]);
              const y = number(ys[i]);
              if (x === null || y === null || x < 0 || x > 120 || Math.abs(y) > 22) continue;
              out.push(project(null, w, h, x, y));
            }
            return out.sort(function(a,b){ return b[1]-a[1]; });
          }
          function car(ctx, w, h, d, lateral, color, label) {
            const p = project(ctx,w,h,d,lateral);
            const scale = clamp(14 / (d + 12), .2, 1.1);
            const cw = 36 * scale;
            const ch = 64 * scale;
            ctx.fillStyle = 'rgba(0,0,0,.6)';
            ctx.fillRect(p[0] - cw*.60, p[1] - ch*.25, cw*1.2, ch*.75);
            ctx.fillStyle = color;
            ctx.fillRect(p[0] - cw/2, p[1]-ch, cw, ch);
            ctx.fillStyle = '#092c35';
            ctx.fillRect(p[0]-cw*.34, p[1]-ch*.74, cw*.68, ch*.24);
            ctx.fillStyle = '#f3fffb';
            ctx.font = Math.max(10,12 * scale) + 'px system-ui';
            ctx.textAlign = 'center';
            ctx.fillText(label,p[0],p[1]-ch-4);
