          function radarTracks(radar) {
            if (!radar || typeof radar !== 'object') return [];
            const arr = [];
            const groups = ['leadsLeft','leadsCenter','leadsRight'];
            for (const key of groups) {
              if (!Array.isArray(radar[key])) continue;
              for (const track of radar[key]) {
                // Do not invent lane offsets: require a real lateral coordinate.
                const dist = number(track && track.dRel);
                const lat = number(track && track.yRel);
                if (dist === null || lat === null || dist < 0 || dist > 110 || Math.abs(lat) > 13 || track.status === false) continue;
                arr.push({dist:dist,lat:lat,group:key});
              }
            }
            if (!arr.length) {
              for (const key of ['leadOne','leadTwo']) {
                const track = radar[key];
                const dist = number(track && track.dRel);
                const lat = number(track && track.yRel);
                if (!track || !track.status || dist === null || lat === null || dist < 0 || dist > 110) continue;
                arr.push({dist:dist,lat:lat,group:'forward'});
