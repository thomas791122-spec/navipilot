        #!/usr/bin/env python3
        """Fix the v4.9.8 / v4.9.9.1 control-center index collision.

        The quit item is last (index 8); index 5 belongs to read-only diagnostics.
        Only the native UI navigation and explicit GPS shutdown are changed.
        """
        from pathlib import Path
        import re

        activity=Path('app/src/main/java/com/jixiexiaoge/drivingassist/TaiwanDashActivity.kt')
        s=activity.read_text(encoding='utf-8')

        def once(old,new,label):
            global s
            n=s.count(old)
            if n != 1:
                raise RuntimeError(f'{label}: expected exactly one anchor, got {n}')
            s=s.replace(old,new,1)

        # v4.9.5 originally appended quit as 5; v4.9.8 reuses 5 for diagnostics,
        # and v4.9.9 adds another entry before quit.  Kotlin accepts duplicated
        # when branches but the first index 5 is taken, so quit is unreachable.
        for required in (
            '5 -> npShowReadOnlyDetails()',
            '6 -> npOpenMapPreview()',
            '7 -> npOpenCurveProfileTest()',
            '5 -> npConfirmExit()',
            '"⏻ 退出 NaviPilot（停止監測）"',
        ):
            assert s.count(required)==1, f'Unrecognized base menu: {required}'

        once('5 -> npConfirmExit()', '8 -> npConfirmExit()', 'unreachable quit callback')

        # The deliberate "monitoring stopped but foreground GPS remains active" policy
        # must NOT apply to an explicit App exit.  Ensure GPS subscription stops even
        # if `stopEverything()` is later changed again.
        pattern = r'(?m)^([ \t]*)stopEverything\("manual_exit"\)[ \t]*\n\1handler\.removeCallbacksAndMessages\(null\)'
        found = list(re.finditer(pattern,s))
        if len(found) != 1:
            raise RuntimeError(f'explicit GPS shutdown on exit: expected one code block, got {len(found)}')
        matched = found[0]
        indent = matched.group(1)
        s = s[:matched.start()] + (indent + 'stopEverything("manual_exit")\n' + indent +
            'stopGps() // Explicit quit also stops the foreground map GPS.\n' + indent +
            'handler.removeCallbacksAndMessages(null)') + s[matched.end():]


        # Fail closed if menu contains any duplicate selection index or any option
        # without a reachable action.  Scope checks to native quick control section.
        start=s.index('private fun showQuickControls() {')
        end=s.index('private fun toggleMonitoringNow()',start)
        segment=s[start:end]
        menu_start=segment.index('val opts = arrayOf(')
        choice_start=segment.index('AlertDialog.Builder(',menu_start)
        menu=segment[menu_start:choice_start]
        assert all(menu.count(label)==1 for label in (
            '⏻ 退出 NaviPilot（停止監測）',
            'ⓘ 車況／原版診斷資料',
            '🗺 MapLibre 開源地圖預覽',
            '🧪 20／60 彎速雙模式測試',
        ))
        choices=re.findall(r'(?m)^\s*(\d+)\s*->\s*([A-Za-z_]\w*)\(',segment[choice_start:])
        indexes=[int(idx) for idx,fn in choices]
        assert indexes==list(range(9)), f'Expected exactly nine unique indexed actions; got {choices}'
        assert dict((int(k),v) for k,v in choices)[8]=='npConfirmExit'
        activity.write_text(s,encoding='utf-8')

        build=Path('app/build.gradle.kts')
        g=build.read_text(encoding='utf-8')
        old_name='versionName = "4.9.9.1-70-inclusive-curve-shadow"'
        assert g.count(old_name)==1
        assert 'applicationIdSuffix = ".taiwan"' in g
        assert 'signingConfig = signingConfigs.getByName("release")' in g
        g=g.replace(old_name,'versionName = "4.9.9.2-curve-shadow-exit-fix"',1)
        g,n=re.subn(r'versionCode = (\d+)',lambda m:'versionCode = '+str(int(m.group(1))+1000000),g,count=1)
        assert n==1
        build.write_text(g,encoding='utf-8')
        manifest=Path('app/src/debug/AndroidManifest.xml')
        m=manifest.read_text(encoding='utf-8')
        assert m.count('NaviPilot Taiwan 4.9.9.1')==1
        manifest.write_text(m.replace('NaviPilot Taiwan 4.9.9.1','NaviPilot Taiwan 4.9.9.2',1),encoding='utf-8')
        print('v4.9.9.2: quit index 8 reachable, GPS shutdown explicit, 9/9 menu actions unique.')
