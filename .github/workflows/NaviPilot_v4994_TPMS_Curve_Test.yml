          function number(x) { const n = Number(x); return Number.isFinite(n) ? n : null; }
          function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
          function project(ctx, width, height, d, y) {
            const dist = clamp(d, 0, 120);
            const depth = 15 / (dist + 15);
            return [width * .5 - (y / 3.5) * width * .235 * depth,
                    height * .87 - (1 - depth) * height * .72];
