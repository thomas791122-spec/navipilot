              pts.forEach(function(p,i){drawPoly(ctx,p,i===1||i===2?'#68edba':'#779ba9',i===1||i===2?3:2,(i===1||i===2)?.92:.5);});
              const tracks=radarTracks(radar);
              for (const t of tracks) car(ctx,w,h,t.dist,t.lat,'#65b6e1',Math.round(t.dist)+'m');
              const anySide = tracks.some(function(t){return t.group==='leadsLeft'||t.group==='leadsRight';});
              footer.textContent = '真實 C4 modelV2：'+laneLines.length+' 條模型線｜車輛：'+tracks.length+' 筆'+(anySide?'（含側車資料）':'（未確認側車資料）')+'。僅供顯示，不能用來判斷換道或避障。';
            } else {
              ctx.fillStyle='#abd7d2';ctx.font='16px system-ui';ctx.textAlign='center';
              ctx.fillText('等待 C4 modelV2 即時車道資料',w/2,h*.42);
              ctx.font='12px system-ui';
              ctx.fillText('未收到資料時不會生成虛構車道或旁車',w/2,h*.49);
              footer.textContent = '目前沒有新鮮的 3D 車道模型。請確認 C4 與 Carrot Web 的模型資料流可用。';
