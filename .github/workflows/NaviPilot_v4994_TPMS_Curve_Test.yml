        package com.jixiexiaoge.drivingassist

        /** Pure decision engine. No networking, Params write, or vehicle-control side effects. */
        internal class TaiwanCurvePolicy499 {
            data class Config(
                val lowKph: Int = 20,
                val normalKph: Int = 60,
                // Exactly 70 km/h belongs to the normal/high-speed band.
                val speedBoundaryKph: Int = 70,
                val confirmMs: Long = 3000L,
            ) {
                fun validated(): Config = copy(
                    lowKph = lowKph.coerceIn(10, 60),
                    normalKph = normalKph.coerceIn(40, 100).coerceAtLeast(lowKph),
                    speedBoundaryKph = speedBoundaryKph.coerceIn(30, 110),
                    confirmMs = confirmMs.coerceIn(1000L, 15000L),
                )
            }

            enum class Mode { LOW, NORMAL }
            data class Result(
                val mode: Mode,
                val recommendedFloorKph: Int,
                val roadDescription: String,
                val reason: String,
            )
            private var mode = Mode.NORMAL
            private var enterSinceMs: Long? = null
            private var lastMs: Long? = null

            fun reset() { mode = Mode.NORMAL; enterSinceMs = null; lastMs = null }

            /**
             * 0 and 6 are highway/expressway candidates from original NaviPilot.
             * Other non-negative road codes are only candidates for ordinary roads.
             * Unknown road code is always the conservative original (normal) profile.
             * NOTE: These are *recommendations only*; road source isn't safety-validated.
             */
            fun update(kph: Double?, roadCode: Int?, nowMs: Long, cfgInput: Config): Result {
                val cfg = cfgInput.validated()
                if (lastMs?.let { nowMs <= it || nowMs - it > 4000L } == true) reset()
                lastMs = nowMs
                val road = when (roadCode) {
                    0 -> "高速公路候選"
                    6 -> "快速道路候選"
                    null, -1 -> "道路未知"
                    else -> if (roadCode >= 0) "一般道路候選（代碼 $roadCode）" else "道路未知"
                }
                val speedValid = kph != null && kph.isFinite() && kph in 0.0..220.0
                val ordinaryCandidate = roadCode != null && roadCode >= 0 && roadCode != 0 && roadCode != 6
                if (!speedValid || !ordinaryCandidate) {
                    mode = Mode.NORMAL
                    enterSinceMs = null
                    val reason = if (!speedValid) "沒有有效車速；維持原設定" else "不是已識別的一般道路；維持原設定"
                    return Result(mode, cfg.normalKph, road, reason)
                }
                val speed = kph!!
                if (speed >= cfg.speedBoundaryKph) {
                    mode = Mode.NORMAL
                    enterSinceMs = null
                    return Result(mode, cfg.normalKph, road, "車速 ≥ ${cfg.speedBoundaryKph}（包含界線）；建議維持原設定")
                }
                if (mode == Mode.LOW) {
                    return Result(mode, cfg.lowKph, road, "車速 < ${cfg.speedBoundaryKph}，一般道路維持低速候選設定")
                }
                if (speed < cfg.speedBoundaryKph) {
                    if (enterSinceMs == null) enterSinceMs = nowMs
                    if (nowMs - enterSinceMs!! >= cfg.confirmMs) {
                        mode = Mode.LOW
                        return Result(mode, cfg.lowKph, road, "低速連續確認 ${cfg.confirmMs / 1000} 秒；建議低速模式")
                    }
                    return Result(mode, cfg.normalKph, road, "低速觀察中，等待連續確認")
                }
                enterSinceMs = null
                return Result(mode, cfg.normalKph, road, "車速未符合低速候選條件，維持原設定")
            }
        }

