          package com.jixiexiaoge.drivingassist

          import org.json.JSONArray
          import org.json.JSONObject
          import java.time.OffsetDateTime
          import java.time.Instant
          import kotlin.math.*

          /** Road-event importer and conservative route matcher. No control commands or automatic road closures. */
          internal object TaiwanRoadEvents48 {
              internal data class Event(
                  val id: String, val title: String, val description: String,
                  val lat: Double, val lon: Double, val kind: String, val source: String,
                  val direction: String, val fullClosure: Boolean,
                  val starts: Long, val ends: Long, val updated: Long
              )
              internal data class Hit(val event: Event, val metres: Int, val along: Double,
                                      val directionOk: Boolean, val directionKnown: Boolean,
                                      val confidence: String)

              private fun timestamp(value: String): Long = runCatching {
                  OffsetDateTime.parse(value.trim()).toInstant().toEpochMilli()
              }.getOrDefault(0L)

              private fun asText(obj: JSONObject, vararg fields: String): String {
                  for (key in fields) {
                      val value = obj.opt(key) ?: continue
                      if (value is String && value.isNotBlank()) return value.trim()
                  }
                  return ""
              }

              private fun coordinates(obj: JSONObject): Pair<Double, Double>? {
                  val latitude = obj.optDouble("Latitude", obj.optDouble("PositionLat", obj.optDouble("lat", Double.NaN)))
                  val longitude = obj.optDouble("Longitude", obj.optDouble("PositionLon", obj.optDouble("lon", Double.NaN)))
                  if (latitude in 20.0..27.0 && longitude in 117.0..125.0) return Pair(latitude, longitude)
                  val wkt = sequenceOf(obj.opt("Positions"), obj.opt("Geometry"), obj.opt("Position"), obj.opt("Location"))
                  val pattern = Regex("(?i)(?:POINT|LINESTRING|MULTIPOINT)\\s*\\(+\\s*(1[12][0-9]\\.\\d+)\\s+(2[0-6]\\.\\d+)")
                  for (value in wkt) {
                      if (value is JSONObject) {
                          val nested=coordinatesShallow(value)
                          if (nested != null) return nested
                      }
                      if (value is JSONArray) {
                          for (i in 0 until min(value.length(), 8)) {
                              val nested = value.optJSONObject(i)?.let { coordinatesShallow(it) }
                              if (nested != null) return nested
                              val match = pattern.find(value.optString(i))
                              if (match != null) return Pair(match.groupValues[2].toDouble(), match.groupValues[1].toDouble())
                          }
                      }
                      val match = pattern.find(value?.toString().orEmpty())
                      if (match != null) return Pair(match.groupValues[2].toDouble(), match.groupValues[1].toDouble())
                  }
                  return null
              }

              private fun coordinatesShallow(obj:JSONObject): Pair<Double,Double>? {
                  val a=obj.optDouble("Latitude",obj.optDouble("PositionLat",obj.optDouble("lat",Double.NaN)))
                  val b=obj.optDouble("Longitude",obj.optDouble("PositionLon",obj.optDouble("lon",Double.NaN)))
                  return if(a in 20.0..27.0 && b in 117.0..125.0) Pair(a,b) else null
              }

              private fun rows(root: Any): JSONArray? {
                  if (root is JSONArray) return root
                  if (root !is JSONObject) return null
                  for (k in arrayOf("RoadEvents", "Events", "value", "Data", "RoadEventList", "RoadEvent")) {
                      val value=root.opt(k)
                      if(value is JSONArray) return value
                      if(value is JSONObject) {
                          val nested=rows(value)
                          if(nested!=null)return nested
                      }
                  }
                  return if (root.has("EventTitle")) JSONArray().put(root) else null
              }

              /** Accepts TDX/MOTC road-event JSON exports; fields not present => not asserted. */
              fun parse(text:String, now:Long=System.currentTimeMillis()):List<Event> {
                  require(text.length in 2..3_000_000) { "檔案超過 3MB 或沒有內容" }
                  val root=org.json.JSONTokener(text).nextValue()
                  val arr=rows(root)?:throw IllegalArgumentException("找不到道路事件陣列；請匯入 TDX 道路事件 JSON")
                  val out=ArrayList<Event>()
                  val seen=HashSet<String>()
                  for (i in 0 until min(arr.length(), 5000)) {
                      val obj=arr.optJSONObject(i)?:continue
                      val place=coordinates(obj)?:continue
                      val title=asText(obj,"EventTitle","Title","Name").take(90)
                      val desc=asText(obj,"Description","EventDescription","Content").take(240)
                      val combined="$title $desc"
                      if (combined.isBlank()) continue
                      val kind=when {
                          listOf("事故","車禍","追撞","翻覆","collision","accident").any{combined.contains(it,true)}->"accident"
                          listOf("施工","養護","道路工程","封閉車道","work zone").any{combined.contains(it,true)}->"work"
                          listOf("封閉","禁止通行","改道","管制","封路").any{combined.contains(it,true)}->"control"
                          else->"other"
                      }
                      val full=listOf("全線封閉","主線全車道封閉","所有車道封閉","全車道封閉","道路完全封閉","匝道封閉","禁止通行").any{combined.contains(it)}
                      val direction=when {
                          listOf("北上","北向").any{combined.contains(it)}->"N"
                          listOf("南下","南向").any{combined.contains(it)}->"S"
                          combined.contains("東向")->"E"
                          combined.contains("西向")->"W"
                          else->"?"
                      }
                      val starts=timestamp(asText(obj,"EffectiveTime","StartTime","EventStartTime"))
                      val ends=timestamp(asText(obj,"ExpireTime","EndTime","EventEndTime"))
                      val updated=timestamp(asText(obj,"LastUpdateTime","PublishTime","UpdateTime"))
                      if(ends>0 && ends<now) continue
                      // Never show stale alerts as current when the feed provides dates.
                      if(updated>0 && now-updated>36L*3600_000 && (starts==0L || starts<now))continue
                      if(starts>now+14L*24*3600_000)continue
                      val id=asText(obj,"EventID","EventUID","ID").take(80).ifBlank{"$title:${place.first}:${place.second}"}
                      if(!seen.add(id))continue
                      out.add(Event(id,title,desc,place.first,place.second,kind,
                          asText(obj,"Source").ifBlank{"TDX / 匯入資料"}.take(50),direction,full,starts,ends,updated))
                      if(out.size>=800)break
                  }
                  return out
              }

              private fun earthDistance(aLat:Double,aLon:Double,bLat:Double,bLon:Double):Double {
                  val la=(aLat+bLat)*.5*Math.PI/180.0
                  val dx=(bLon-aLon)*111_320*cos(la)
                  val dy=(bLat-aLat)*111_320
                  return hypot(dx,dy)
              }

              /** Close-by events are *candidates*. Direction/road-level cannot be fully proved from coordinates alone. */
              fun match(route:JSONArray, events:List<Event>, now:Long=System.currentTimeMillis()):List<Hit> {
                  if(route.length()<2||events.isEmpty()) return emptyList()
                  val points=ArrayList<Pair<Double,Double>>()
                  val skip=max(1,route.length()/1500)
                  for(i in 0 until route.length() step skip){
                      val p=route.optJSONArray(i)?:continue
                      val lon=p.optDouble(0,Double.NaN);val lat=p.optDouble(1,Double.NaN)
                      if(lat in 20.0..27.0 && lon in 117.0..125.0)points.add(Pair(lat,lon))
                  }
                  route.optJSONArray(route.length()-1)?.let {points.add(Pair(it.optDouble(1),it.optDouble(0)))}
                  if(points.size<2)return emptyList()
                  val cumulative=DoubleArray(points.size)
                  for(i in 1 until points.size) cumulative[i]=cumulative[i-1]+earthDistance(points[i-1].first,points[i-1].second,points[i].first,points[i].second)
                  val hits=ArrayList<Hit>()
                  for(e in events.take(800)) {
                      if(e.starts>now || (e.ends>0 && e.ends<now))continue
                      var best=Double.POSITIVE_INFINITY;var bestAlong=0.0;var bestBearing="?"
                      for(i in 1 until points.size) {
                          val a=points[i-1];val b=points[i]
                          if(abs(a.first-e.lat)>0.005 && abs(b.first-e.lat)>0.005)continue
                          if(abs(a.second-e.lon)>0.005 && abs(b.second-e.lon)>0.005)continue
                          val mid=(a.first+b.first)*.5*Math.PI/180.0
                          val sx=(b.second-a.second)*111320*cos(mid);val sy=(b.first-a.first)*111320.0
                          val px=(e.lon-a.second)*111320*cos(mid);val py=(e.lat-a.first)*111320.0
                          val denom=sx*sx+sy*sy
                          val t=if(denom<1.0)0.0 else ((px*sx+py*sy)/denom).coerceIn(0.0,1.0)
                          val d=hypot(px-t*sx,py-t*sy)
                          if(d<best){best=d;bestAlong=cumulative[i-1]+sqrt(denom)*t
                              bestBearing=if(abs(sy)>=abs(sx)*1.5) {if(sy>=0)"N" else "S"}
                                else if(abs(sx)>=abs(sy)*1.5) {if(sx>=0)"E" else "W"} else "?"
                          }
                      }
                      if(best>85)continue
                      val known=e.direction!="?" && bestBearing!="?"
                      val ok=known && e.direction==bestBearing
                      val confidence=if(known && !ok)"方向不符" else if(ok && best<=45)"方向接近" else "道路／方向待核對"
                      // Never show opposite-direction incidents as a matched incident on this route.
                      if(known && !ok)continue
                      hits.add(Hit(e,best.roundToInt(),bestAlong,ok,known,confidence))
                  }
                  return hits.sortedBy{it.along}.take(100)
              }
          }
