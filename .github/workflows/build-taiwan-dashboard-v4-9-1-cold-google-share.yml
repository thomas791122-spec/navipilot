                      runOnUiThread {
                          if(isFinishing||isDestroyed||revision!=routeRevision||routeJson!=route)return@runOnUiThread
                          result.onSuccess { (status,best,others) ->
                              trafficCurrent47=best;trafficAlternative47=others
                              trafficAge47=best.ageMinutes
                              trafficStatus47=if(best.samples.isEmpty()) "$status · 路線無可靠國道匹配" else
