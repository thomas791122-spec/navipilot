                  val text=runCatching {
                      val choices=mutableListOf<String>()
                      incoming.getCharSequenceExtra(Intent.EXTRA_TEXT)?.toString()?.let { choices.add(it) }
                      incoming.getStringExtra(Intent.EXTRA_TEXT)?.let { choices.add(it) }
                      incoming.clipData?.let { clip ->
                          for(i in 0 until minOf(clip.itemCount,4)) {
                              clip.getItemAt(i).text?.toString()?.let { choices.add(it) }
                              clip.getItemAt(i).uri?.toString()?.let { choices.add(it) }
                          }
                      }
                      incoming.dataString?.let { choices.add(it) }
                      if (choices.isEmpty()) incoming.getCharSequenceExtra(Intent.EXTRA_SUBJECT)?.toString()?.let { choices.add(it) }
                      // Prefer text that contains the Google URL; a bare title alone may be ambiguous.
                      choices.firstOrNull { it.contains("https://",true) || it.contains("http://",true) || it.startsWith("geo:",true) }
                          ?: choices.firstOrNull { it.isNotBlank() }
                  }.getOrNull()?.trim()?.take(4096).orEmpty()
                  // ACTION_VIEW must be an explicit Maps URL; don't hijack unrelated website links.
                  if(action == Intent.ACTION_VIEW) {
                      val host=runCatching { java.net.URI(text).host.orEmpty() }.getOrDefault("")
                      if(!text.startsWith("https://",true) || !googleHost(host)) return
                  }
                  if(text.isBlank()) {
                      TaiwanDashState.log(this,"SHARE_491_EMPTY $source")
                      return
                  }
                  shareGeneration491++
                  shareDelivering491=false
                  val accepted=sharedPrefs491().edit()
                      .putString("shared_text",text).putLong("shared_at",System.currentTimeMillis())
                      .remove("pending_destination").commit()
                  TaiwanDashState.log(this,"SHARE_491_CAPTURE $source len=${text.length} persisted=$accepted")
                  // Consume only the incoming Intent; it must not repeat after Activity recreation.
                  incoming.removeExtra(Intent.EXTRA_TEXT)
                  incoming.removeExtra(Intent.EXTRA_SUBJECT)
                  incoming.clipData=null
                  incoming.action=Intent.ACTION_MAIN
                  pendingImportedPoint=null
              }
          
              private fun restorePendingDestination491() {
                  if(sharedPrefs491().contains("shared_text")) return // A newer share takes precedence.
                  val raw=sharedPrefs491().getString("pending_destination","").orEmpty()
                  val parts=raw.split(',')
                  if(parts.size!=2)return
                  val lat=parts[0].toDoubleOrNull() ?: return
                  val lon=parts[1].toDoubleOrNull() ?: return
                  pendingImportedPoint=validPoint(lat,lon)
                  if(pendingImportedPoint!=null) {
                      routeBanner="Google Maps 目的地已保留 · 等待 GPS 精確定位…"
                      updateScreen()
                  }
              }
          
              private fun deliverShare491() {
                  if(isFinishing || isDestroyed || !mapReady || shareDelivering491) return
                  val pref=sharedPrefs491()
                  val text=pref.getString("shared_text","").orEmpty()
                  if(text.isBlank())return
                  val age=System.currentTimeMillis()-pref.getLong("shared_at",0L)
                  if(age<0 || age>2*60*60*1000L) {
                      pref.edit().remove("shared_text").remove("shared_at").apply()
                      routeBanner="上次分享已過期 · 請重新分享目的地"
                      updateScreen()
                      return
                  }
                  shareDelivering491=true
                  val generation=shareGeneration491
                  // Run only after the UI/Activity has completed initialization.
                  handler.post {
                      if(isFinishing || isDestroyed || generation!=shareGeneration491) {
                          shareDelivering491=false
                          return@post
                      }
                      // Clear the accepted request, but the parsed destination is persisted separately
                      // until GPS is ready, avoiding loss on process recreation.
                      pref.edit().remove("shared_text").remove("shared_at").commit()
                      shareDelivering491=false
                      chooseDisplayMode(0)
                      routeBanner="已收到 Google Maps 目的地 · 正在辨識…"
                      updateScreen()
                      TaiwanDashState.log(this,"SHARE_491_DELIVER")
                      resolveSharedPlace(text)
                  }
              }
          
              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  captureShare491(intent,"WARM")
                  handler.post { if(!isFinishing && !isDestroyed) deliverShare491() }
              }
          
