      - name: Add v4.7 freeway live XML traffic, ETA correction and alternatives
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/navipilot_taiwan_traffic47.kt <<'TW_V47_KOTLIN'
          package com.jixiexiaoge.drivingassist

          import java.io.ByteArrayOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.time.OffsetDateTime
          import javax.xml.XMLConstants
          import javax.xml.parsers.DocumentBuilderFactory
          import org.w3c.dom.Element
          import org.w3c.dom.Document
          import kotlin.math.*

          /** Freeway Bureau *public* read-only XML. No TDX key, no driver commands. */
          internal object TaiwanTraffic47 {
              private const val ROOT = "https://tisvcloud.freeway.gov.tw/history/motc20/"
              private const val CACHE_MS = 150_000L
              private const val MAX_AGE_MS = 15 * 60_000L
              data class Geo(val lon: Double, val lat: Double)
              data class Edge(val id: String, val a: Geo, val b: Geo)
              data class Live(val speed: Double, val level: Int)
              data class Sample(val a: Geo, val b: Geo, val level: Int, val speed: Int, val delay: Double, val along: Double)
              data class Analysis(val samples: List<Sample>, val delaySeconds: Double, val coveredMeters: Double,
                                  val routeMeters: Double, val ageMinutes: Int, val status: String) {
                  val coverage: Double get() = if(routeMeters > 0) coveredMeters / routeMeters else 0.0
              }
              private var index: Map<Long, List<Edge>> = emptyMap()
              private var live: Map<String, Live> = emptyMap()
              private var sourceAt = 0L
              private var refreshedAt = 0L
              private var error: String? = null
              private fun cell(x: Int,y: Int):Long = (x.toLong() shl 32) xor (y.toLong() and 0xffffffffL)
              private fun grid(a: Double) = floor(a / .003).toInt()
              private fun radians(x: Double) = x * Math.PI / 180.0
              private fun dist(a:Geo,b:Geo): Double {
                  val x=(b.lon-a.lon)*111195.0*cos(radians((a.lat+b.lat)*.5))
                  val y=(b.lat-a.lat)*111195.0
                  return hypot(x,y)
              }
              private fun read(url: String, limit: Int): ByteArray {
                  val u=URL(ROOT+url)
                  require(u.protocol=="https" && u.host=="tisvcloud.freeway.gov.tw")
                  val c=u.openConnection() as HttpURLConnection
                  c.instanceFollowRedirects=false; c.connectTimeout=13000; c.readTimeout=16000
                  c.setRequestProperty("Accept", "application/xml,text/xml")
                  c.setRequestProperty("User-Agent", "NaviPilotTaiwan/4.7 traffic-readonly-test")
                  try {
                      check(c.responseCode==200) { "國道路況 HTTP ${c.responseCode}" }
                      val out=ByteArrayOutputStream()
                      c.inputStream.use { input ->
                          val buf=ByteArray(16384)
                          while(true) {
                              val n=input.read(buf)
                              if(n<0)break
                              check(out.size()+n<=limit) { "路況 XML 過大" }
                              out.write(buf,0,n)
                          }
                      }
                      return out.toByteArray()
                  } finally { c.disconnect() }
              }
              private fun xml(bytes:ByteArray): Document {
                  val f=DocumentBuilderFactory.newInstance()
                  f.setFeature("http://apache.org/xml/features/disallow-doctype-decl",true)
                  f.setFeature("http://xml.org/sax/features/external-general-entities",false)
                  f.setFeature("http://xml.org/sax/features/external-parameter-entities",false)
                  f.setFeature("http://apache.org/xml/features/nonvalidating/load-external-dtd",false)
                  f.setFeature(XMLConstants.FEATURE_SECURE_PROCESSING,true)
                  f.isXIncludeAware=false; f.isExpandEntityReferences=false
                  return f.newDocumentBuilder().parse(bytes.inputStream())
              }
              private fun child(e:Element,name:String):String {
                  val nodes=e.getElementsByTagName(name)
                  return if(nodes.length>0) nodes.item(0).textContent?.trim().orEmpty() else ""
              }
              private fun parseTime(s:String):Long = try {OffsetDateTime.parse(s).toInstant().toEpochMilli()} catch (_:Exception) {0L}
              private fun parseWkt(wkt:String): List<Geo> {
                  if (!wkt.trimStart().uppercase().startsWith("LINESTRING") &&
                      !wkt.trimStart().uppercase().startsWith("MULTILINESTRING")) return emptyList()
                  val matches=Regex("[-+]?\\d{1,3}(?:\\.\\d+)?").findAll(wkt).map{it.value.toDoubleOrNull()}.toList()
                  val out=ArrayList<Geo>()
                  for (i in 0 until matches.size-1 step 2) {
                      val lon=matches[i]?:continue;val lat=matches[i+1]?:continue
                      if(lon in 119.0..123.5 && lat in 21.0..26.5)out.add(Geo(lon,lat))
                      if(out.size>1500)break
                  }
                  return out
              }
              private fun loadShapes(): Map<Long,List<Edge>> {
                  val d=xml(read("SectionShape.xml",28_000_000))
                  val out=HashMap<Long,MutableList<Edge>>()
                  val sections=d.getElementsByTagName("SectionShape")
                  for(i in 0 until min(sections.length,9000)) {
                      val el=sections.item(i) as? Element?:continue
                      val id=child(el,"SectionID");if(id.isBlank())continue
                      val points=parseWkt(child(el,"Geometry"));if(points.size<2)continue
                      for(j in 0 until points.size-1) {
                          val a=points[j];val b=points[j+1];val meters=dist(a,b)
                          if(meters<=0.2||meters>1500)continue
                          val e=Edge(id,a,b)
                          val steps=ceil(meters/180.0).toInt().coerceIn(1,15)
                          var old=Long.MIN_VALUE
                          for(k in 0..steps) {
                              val f=k.toDouble()/steps
                              val key=cell(grid(a.lat+(b.lat-a.lat)*f),grid(a.lon+(b.lon-a.lon)*f))
                              if(key!=old){out.getOrPut(key){mutableListOf()}.add(e);old=key}
                          }
                      }
                  }
                  require(out.isNotEmpty()) { "國道路段線型資料為空" }
                  return out
              }
              private fun loadLive():Pair<Map<String,Live>,Long> {
                  val d=xml(read("LiveTraffic.xml",20_000_000))
                  val whenPublished=parseTime(d.documentElement?.let { child(it,"UpdateTime") }.orEmpty())
                  require(whenPublished>0) { "路況沒有有效更新時間" }
                  val rows=d.getElementsByTagName("LiveTraffic")
                  val result=HashMap<String,Live>()
                  for(i in 0 until min(rows.length,15000)) {
                      val el=rows.item(i) as? Element?:continue
                      val id=child(el,"SectionID")
                      val speed=child(el,"TravelSpeed").toDoubleOrNull()?:continue
                      val level=child(el,"CongestionLevel").toIntOrNull()?:0
                      if(id.isNotEmpty()&&speed>0&&speed<200&&level in 0..5)result[id]=Live(speed,level)
                  }
                  require(result.isNotEmpty()) { "國道路況無可用車速" }
                  return result to whenPublished
              }
              /** Call only from a background thread, at most once per 150 sec. */
              @Synchronized fun refresh(force: Boolean = false):String {
                  val now=System.currentTimeMillis()
                  if(!force && now-refreshedAt<CACHE_MS)return status()
                  refreshedAt=now
                  try {
                      if(index.isEmpty()) index=loadShapes()
                      val (newLive,time)=loadLive()
                      live=newLive;sourceAt=time;error=null
                  } catch (e:Exception) {error=e.message?.take(100)?:e.javaClass.simpleName}
                  return status()
              }
              @Synchronized fun status():String {
                  val age=System.currentTimeMillis()-sourceAt
                  return when {
                      index.isEmpty() -> "國道路段線型無資料"+(error?.let{": $it"}?:"")
                      sourceAt==0L -> "國道即時資料未取得"+(error?.let{": $it"}?:"")
                      age !in 0..MAX_AGE_MS -> "國道路況過期 · 不修正 ETA"
                      else -> "高公局國道資料 · 約 ${age/60000} 分前更新"
                  }
              }
              @Synchronized fun analyze(route:List<Geo>):Analysis {
                  if(route.size<2)return Analysis(emptyList(),0.0,0.0,0.0,0,"未規劃路線")
                  val now=System.currentTimeMillis();val age=now-sourceAt
                  var total=0.0
                  for(i in 0 until route.size-1)total+=dist(route[i],route[i+1])
                  if(index.isEmpty()||sourceAt==0L||age !in 0..MAX_AGE_MS)return Analysis(emptyList(),0.0,0.0,total,(age/60000).toInt(),status())
                  val samples=ArrayList<Sample>();var covered=0.0;var delay=0.0;var along=0.0
                  var last=route.first()
                  for(i in 1 until route.size) {
                      val to=route[i];val leg=dist(last,to)
                      if(leg<.1||leg>1500){along+=leg;last=to;continue}
                      val steps=ceil(leg/170.0).toInt().coerceAtLeast(1)
                      for(j in 0 until steps) {
                          val t0=j.toDouble()/steps;val t1=(j+1).toDouble()/steps
                          val a=Geo(last.lon+(to.lon-last.lon)*t0,last.lat+(to.lat-last.lat)*t0)
                          val b=Geo(last.lon+(to.lon-last.lon)*t1,last.lat+(to.lat-last.lat)*t1)
                          val m=dist(a,b);val center=Geo((a.lon+b.lon)*.5,(a.lat+b.lat)*.5)
                          val vx=(b.lon-a.lon)*cos(radians(center.lat));val vy=b.lat-a.lat
                          val mag=hypot(vx,vy);var best=Double.POSITIVE_INFINITY;var found:Live?=null
                          val cx=grid(center.lat);val cy=grid(center.lon)
                          for(dx in -1..1)for(dy in -1..1)for(edge in index[cell(cx+dx,cy+dy)].orEmpty()) {
                              val data=live[edge.id]?:continue
                              val ex=(edge.b.lon-edge.a.lon)*cos(radians(center.lat));val ey=edge.b.lat-edge.a.lat
                              val dot=(ex*vx+ey*vy)/(hypot(ex,ey)*mag).coerceAtLeast(1e-12)
                              if(dot<0.6)continue // Directional match; no reverse-lane assumptions.
                              val mx=(center.lon-edge.a.lon)*111195*cos(radians(center.lat))
                              val my=(center.lat-edge.a.lat)*111195
                              val sx=(edge.b.lon-edge.a.lon)*111195*cos(radians(center.lat))
                              val sy=(edge.b.lat-edge.a.lat)*111195
                              val t=((mx*sx+my*sy)/(sx*sx+sy*sy)).coerceIn(0.0,1.0)
                              val gap=hypot(mx-sx*t,my-sy*t)
                              if(gap<best){best=gap;found=data}
                          }
                          if(best<=45.0 && found!=null) {
                              val d=found
                              covered+=m
                              val delta=max(0.0,m*3.6/d.speed-m*3.6/90.0).coerceAtMost(m*3.6/6.0)
                              delay+=delta
                              samples.add(Sample(a,b,d.level, d.speed.toInt(),delta,along+leg*t1))
                          }
                      }
                      along+=leg;last=to
                      if(samples.size>9000)break
                  }
                  return Analysis(samples,delay.coerceAtMost(14400.0),covered,total,(age/60000).toInt(),status())
