                      val result=runCatching {
                          val status=TaiwanTraffic47.refresh(force)
                          val best=TaiwanTraffic47.analyze(parseRoute47(route))
                          val alts=JSONArray(alternativeSnapshot)
                          val others=ArrayList<TaiwanTraffic47.Analysis>()
                          for(i in 0 until alts.length()) {
                              val item=alts.optJSONObject(i)?:continue
                              others.add(TaiwanTraffic47.analyze(parseRoute47(item.optJSONArray("coords")?.toString()?:"[]")))
                          }
                          Triple(status,best,others)
