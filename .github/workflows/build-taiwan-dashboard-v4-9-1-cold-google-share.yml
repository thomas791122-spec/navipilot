                          if(isDestroyed || isFinishing) return@runOnUiThread
                          if(p != null) showImportedPlace(p)
                          else AlertDialog.Builder(this).setTitle("尚無法辨識目的地")
                              .setMessage("Google 分享短網址不一定含座標。可回到 NaviPilot 地圖，使用『選目的地』點一下位置；Google 原路線不會直接匯入。")
                              .setPositiveButton("選地圖位置") { _, _ -> beginMapPicking() }
                              .setNegativeButton("關閉",null).show()
                      }
                  }
              }

              private fun showImportedPlace(point: Pair<Double,Double>) {
                  val text=String.format(java.util.Locale.US,"%.6f, %.6f",point.first,point.second)
                  AlertDialog.Builder(this).setTitle("確認目的地")
                      .setMessage("辨識到座標：$text\n將使用 NaviPilot 獨立計算路線，不會複製 Google Maps 的路線。")
                      .setPositiveButton("規劃路線") { _, _ -> chooseDisplayMode(0); confirmRoute(point.first,point.second) }
                      .setNegativeButton("取消",null).show()
              }

          '''
