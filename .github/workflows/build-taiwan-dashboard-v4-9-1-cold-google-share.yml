           const route=routePoints.map(c=>{const q=project(c[1],c[0]);return (q.x-p.x+w/2).toFixed(1)+','+(q.y-p.y+h/2).toFixed(1)}).join(' ');
           line.innerHTML=route?'<polyline points="'+route+'" stroke="#0e2236" stroke-width="13" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polyline points="'+route+'" stroke="#19a5ff" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/>':'';
           const pin=document.getElementById('destPin');if(routePoints.length){const c=routePoints[routePoints.length-1],q=project(c[1],c[0]);
            pin.style.left=(q.x-p.x+w/2)+'px';pin.style.top=(q.y-p.y+h/2)+'px';pin.style.display='block';}else pin.style.display='none';
           const markers=document.getElementById('cams');markers.innerHTML='';
