                  val queryName=runCatching {
                      val u=android.net.Uri.parse(Regex("https?://[^\\s<>\\\"]+",RegexOption.IGNORE_CASE).find(page)?.value ?: page)
                      u.getQueryParameter("destination") ?: u.getQueryParameter("query") ?: u.getQueryParameter("q")
                  }.getOrNull()
                  val rawName=nameLine ?: queryName ?: pathName ?: return null
                  val decoded=runCatching { URLDecoder.decode(rawName.replace("+","%20"),"UTF-8") }.getOrDefault(rawName)
                      .replace('_',' ').replace(Regex("\\s+")," ").trim().removeSuffix(" - Google 地圖")
                  if(decoded.length !in 2..110 || decoded.startsWith("0x") || decoded.startsWith("data="))return null
                  return decoded
              }

              private fun expandGoogleLink(raw:String):String {
                  var next=raw
                  repeat(6) {
                      val uri=java.net.URI(next)
                      if(uri.scheme!="https" || !googleHost(uri.host.orEmpty()))
                          throw IllegalArgumentException("分享連結不是允許的 Google Maps HTTPS 網址")
                      val conn=URL(next).openConnection() as HttpURLConnection
                      conn.instanceFollowRedirects=false
                      conn.connectTimeout=8000;conn.readTimeout=8000
                      conn.setRequestProperty("User-Agent","Mozilla/5.0 NaviPilotTaiwan/4.5 (private use)")
                      try {
                          val code=conn.responseCode
                          if(code in 300..399) {
                              val loc=conn.getHeaderField("Location") ?: return next
                              next=uri.resolve(loc).toString()
                          } else {
                              if(code !in 200..299)throw IllegalStateException("Google 連結無法開啟（HTTP $code）")
                              return next
                          }
                      } finally { conn.disconnect() }
                  }
                  return next
              }

              private fun resolveSharedPlace(raw:String) {
                  val direct=coordinatesInSharedText(raw)
                  if(direct!=null){showImportedPlace(direct);return}
                  val match=Regex("https?://[^\\s<>\\\"]+",RegexOption.IGNORE_CASE).find(raw)
                  val link=match?.value?.trimEnd('.',',',')')
                  val uri=link?.let { runCatching {java.net.URI(it)}.getOrNull() }
                  if(uri==null || uri.scheme!="https" || !googleHost(uri.host.orEmpty())) {
                      val name=extractShareName(raw)
                      if(name!=null) offerSystemPlaceLookup(name)
                      else showShareFailure("未找到可辨識的 Google Maps 連結或地點名稱")
                      return
                  }
                  Toast.makeText(this,"正在解析分享目的地…",Toast.LENGTH_SHORT).show()
                  thread(name="navi-google-share") {
                      val expanded=runCatching {expandGoogleLink(link!!)}
                      val final=expanded.getOrDefault("")
                      val point=coordinatesInSharedText(final)
                      val name=extractShareName(raw,final)
                      runOnUiThread {
                          if(isFinishing || isDestroyed)return@runOnUiThread
                          if(point!=null)showImportedPlace(point)
                          else if(name!=null)offerSystemPlaceLookup(name)
                          else showShareFailure(expanded.exceptionOrNull()?.message ?: "Google 連結沒有提供目的地座標")
                      }
                  }
              }

              private fun offerSystemPlaceLookup(name:String) {
                  val input=EditText(this).apply { setSingleLine(true);setText(name);selectAll() }
                  AlertDialog.Builder(this).setTitle("以分享地點名稱找目的地")
                      .setMessage("Google 分享連結沒有明確座標。可用 Android 系統地理編碼服務查詢下列地點；搜尋結果需再確認。查詢時會將地點名稱交給系統定位服務。")
                      .setView(input)
                      .setPositiveButton("查詢地點") { _, _ ->
                          val search=input.text.toString().trim().take(110)
                          if(search.length>=2)lookupShareName(search) else showShareFailure("地點名稱太短")
                      }
                      .setNeutralButton("改在地圖選點") { _, _ -> beginMapPicking() }
                      .setNegativeButton("取消",null).show()
              }

              private fun lookupShareName(name:String) {
                  if(!Geocoder.isPresent()){showShareFailure("裝置沒有提供地理編碼服務");return}
                  Toast.makeText(this,"正在以地點名稱查詢…",Toast.LENGTH_SHORT).show()
                  thread(name="navi-share-geocode") {
                      @Suppress("DEPRECATION")
                      val results=runCatching {
                          Geocoder(this,java.util.Locale.TAIWAN).getFromLocationName(name,4).orEmpty()
                              .filter { it.hasLatitude() && it.hasLongitude() && validPoint(it.latitude,it.longitude)!=null }.take(4)
                      }.getOrDefault(emptyList())
                      runOnUiThread {
                          if(isFinishing || isDestroyed)return@runOnUiThread
                          if(results.isEmpty()){showShareFailure("系統找不到這個地點，請在地圖上移動並選點");return@runOnUiThread}
                          val names=results.map { (it.getAddressLine(0) ?: name).take(85) }.toTypedArray()
                          AlertDialog.Builder(this).setTitle("請確認真正的目的地")
                              .setItems(names) { _, i -> showImportedPlace(Pair(results[i].latitude,results[i].longitude)) }
                              .setNegativeButton("取消",null).show()
                      }
                  }
              }

              private fun showShareFailure(reason:String) {
                  AlertDialog.Builder(this).setTitle("目的地尚未匯入")
                      .setMessage("$reason。可以在 NaviPilot 地圖自由拖動，再按『選目的地』點一下位置。")
                      .setPositiveButton("前往地圖選點") { _, _ -> beginMapPicking() }
                      .setNegativeButton("關閉",null).show()
              }

