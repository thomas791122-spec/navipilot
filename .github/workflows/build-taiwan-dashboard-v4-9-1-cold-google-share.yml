      - name: Compile stable signed APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify stable install identity and signing
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.jixiexiaoge.drivingassist.taiwan'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          echo 'Verified stable package ID and signed APK.'

      - name: Upload signed NaviPilot v4.9.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: NaviPilot-Taiwan-Dashboard-v491-signed
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
