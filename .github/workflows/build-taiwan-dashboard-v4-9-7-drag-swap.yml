            }
            return arr;
          }
          function render3D() {
            if (!active3D) return;
            const canvas = active3D.querySelector('canvas');
            const ctx = canvas.getContext('2d');
            const box = canvas.getBoundingClientRect();
            const w = Math.max(160, Math.round(box.width));
            const h = Math.max(130, Math.round(box.height));
            if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
            const gradient = ctx.createLinearGradient(0,0,0,h);
            gradient.addColorStop(0,'#071d2a');gradient.addColorStop(1,'#122b31');
            ctx.fillStyle=gradient;ctx.fillRect(0,0,w,h);
            const state = window.CarrotOverlayState || {};
            const model = state.modelV2;
            const radar = state.radarState;
            const laneLines = Array.isArray(model && model.laneLines) ? model.laneLines : [];
            if (model && model !== lastModel) { lastModel = model; lastModelTime = Date.now(); }
            const fresh = !!lastModel && Date.now() - lastModelTime <= 5000;
            const footer = active3D.querySelector('footer');
            if (fresh && laneLines.length) {
              // Only the model's real lane lines are drawn; no synthetic side lanes.
              const pts = laneLines.map(function(l){ return lanePoints(l,w,h); });
              if (pts.length >= 3 && pts[1].length > 1 && pts[2].length > 1) {
                const road = pts[1].slice().concat(pts[2].slice().reverse());
                ctx.fillStyle = 'rgba(23,91,85,.19)';
                ctx.beginPath();ctx.moveTo(road[0][0],road[0][1]);
                road.slice(1).forEach(function(q){ctx.lineTo(q[0],q[1]);});
                ctx.closePath();ctx.fill();
