    - name: Apply v4.9.7 drag divider and tap to swap Carrot and map
      shell: bash
      run: |
        set -euo pipefail
        cat > /tmp/np_patch_v497.py <<'NP_497_PY'
        #!/usr/bin/env python3
        """v4.9.7: draggable split divider + tap-to-swap; keep existing WebViews."""
        from pathlib import Path
        import re

        activity = Path("app/src/main/java/com/jixiexiaoge/drivingassist/TaiwanDashActivity.kt")
        s = activity.read_text(encoding="utf-8")

        anchor = "    private fun npShowSplitEditor() {"
        assert s.count(anchor) == 1, "Expected v4.9.6 split editor"
        methods = """    // v4.9.7: Android-style split handle (display-only).
            // No Carrot/CAN/navigation writes. Reuses the existing map and video WebViews.
            private var npSplitHandle: FrameLayout? = null
            private var npSplitTouchStart = 0f
            private var npSplitStartPercent = 73
            private var npSplitDragPercent = 73
            private var npSplitMoved = false

            private fun npPaneOrderReversed(): Boolean =
                layoutPrefs().getBoolean("np_split_reversed", false)

            private fun npAttachSplitPanes() {
                if (!::content.isInitialized || !::cameraPanel.isInitialized || !::mapPanel.isInitialized) return
                if (focused || cameraPanel.parent !== content || mapPanel.parent !== content) {
                    npSplitHandle = null
                    return
                }
                val cameraLp = cameraPanel.layoutParams as? LinearLayout.LayoutParams ?: return
                val mapLp = mapPanel.layoutParams as? LinearLayout.LayoutParams ?: return
                val horizontal = resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE
                val handle = FrameLayout(this).apply {
                    background = shape(Color.rgb(24, 70, 69), 10)
                    isClickable = true
                    isFocusable = true
                    contentDescription = "拖曳調整影像與地圖比例，輕點交換兩個視窗"
                }
                val grip = text(if (horizontal) "⋮" else "≡", 20f, Color.rgb(101, 240, 207)).apply {
                    gravity = Gravity.CENTER
                    setTypeface(null, Typeface.BOLD)
                }
                handle.addView(grip, FrameLayout.LayoutParams(
                    ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT
                ))
                handle.setOnClickListener { npSwapSplitPanes() }
                handle.setOnTouchListener { v, event ->
                    val axis = if (horizontal) event.rawX else event.rawY
                    when (event.actionMasked) {
                        MotionEvent.ACTION_DOWN -> {
                            npSplitTouchStart = axis
                            npSplitStartPercent = npSplitPercent()
                            npSplitDragPercent = npSplitStartPercent
                            npSplitMoved = false
                            v.parent?.requestDisallowInterceptTouchEvent(true)
                            true
                        }
                        MotionEvent.ACTION_MOVE -> {
                            val delta = axis - npSplitTouchStart
                            if (kotlin.math.abs(delta) >
                                android.view.ViewConfiguration.get(this).scaledTouchSlop) {
                                npSplitMoved = true
                            }
                            if (npSplitMoved) {
                                val available = if (horizontal) content.width - handle.width
                                                else content.height - handle.height
                                if (available > 0) {
                                    val direction = if (npPaneOrderReversed()) -1f else 1f
                                    val next = (npSplitStartPercent +
                                        (delta * direction * 100f / available)).roundToInt()
                                        .coerceIn(30, 85)
                                    npSplitDragPercent = next
                                    npUpdateSplitWeights(next)
                                }
                            }
                            true
                        }
                        MotionEvent.ACTION_UP -> {
                            if (npSplitMoved) {
                                npSetCustomSplit(npSplitDragPercent)
                            } else {
                                v.performClick() // onClick swaps panes; accessible to TalkBack as well.
                            }
                            true
                        }
                        MotionEvent.ACTION_CANCEL -> {
                            npUpdateSplitWeights(npSplitStartPercent)
                            true
                        }
                        else -> true
                    }
                }
                npSplitHandle = handle

                // Reparent only the two PANEL views; their embedded WebViews are reused.
                // Do not call loadUrl(), reconnect C4, or recreate either WebView.
                content.removeAllViews()
                val handleLp = if (horizontal) {
                    LinearLayout.LayoutParams(dp(30), ViewGroup.LayoutParams.MATCH_PARENT).apply {
                        leftMargin = dp(2); rightMargin = dp(2)
                    }
                } else {
                    LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(30)).apply {
                        topMargin = dp(2); bottomMargin = dp(2)
                    }
                }
                if (npPaneOrderReversed()) {
                    content.addView(mapPanel, mapLp)
                    content.addView(handle, handleLp)
                    content.addView(cameraPanel, cameraLp)
                } else {
                    content.addView(cameraPanel, cameraLp)
                    content.addView(handle, handleLp)
                    content.addView(mapPanel, mapLp)
                }
                npUpdateSplitWeights(npSplitPercent())
            }

            private fun npUpdateSplitWeights(percent: Int) {
                if (!::content.isInitialized || focused ||
                    cameraPanel.parent !== content || mapPanel.parent !== content) return
                val cameraLp = cameraPanel.layoutParams as? LinearLayout.LayoutParams ?: return
                val mapLp = mapPanel.layoutParams as? LinearLayout.LayoutParams ?: return
                val p = percent.coerceIn(30, 85).toFloat()
                if (resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE) {
                    cameraLp.weight = p
                    mapLp.weight = 100f - p
                } else {
                    cameraLp.weight = p / 100f
                    mapLp.weight = 1f - p / 100f
                }
                cameraPanel.layoutParams = cameraLp
                mapPanel.layoutParams = mapLp
                if (::npCameraSplitInfo.isInitialized) {
                    npCameraSplitInfo.text =
                        "Carrot ${p.toInt()}% / 地圖 ${100 - p.toInt()}% · 點分隔線交換"
                }
                content.requestLayout()
            }

            private fun npSwapSplitPanes() {
                if (focused || mapPanel.parent !== content) return
                layoutPrefs().edit()
                    .putBoolean("np_split_reversed", !npPaneOrderReversed()).apply()
                npAttachSplitPanes()
                Toast.makeText(this, "已交換 Carrot 與地圖位置", Toast.LENGTH_SHORT).show()
            }

        """
        s = s.replace(anchor, methods + anchor, 1)

        # Insert splitter into EVERY non-fullscreen render (the helper skips focused).
        # Do not modify the old layout weighting or nested WebViews.
        footer_anchor = 'val footer = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; pad(this, 5) }'
        assert s.count(footer_anchor) == 1, "Expected one renderLayout footer anchor"
        s = s.replace(footer_anchor, 'npAttachSplitPanes()\n                  ' + footer_anchor, 1)

        activity.write_text(s, encoding="utf-8")

        build = Path("app/build.gradle.kts")
        g = build.read_text(encoding="utf-8")
        assert g.count('versionName = "4.9.6-interactive-split"') == 1
        assert 'applicationIdSuffix = ".taiwan"' in g
        assert 'signingConfig = signingConfigs.getByName("release")' in g
        g = g.replace('versionName = "4.9.6-interactive-split"',
                      'versionName = "4.9.7-drag-swap-split"', 1)
        g, n = re.subn(r'versionCode = (\d+)',
                       lambda m: "versionCode = " + str(int(m.group(1)) + 1000000),
                       g, count=1)
        assert n == 1
        build.write_text(g, encoding="utf-8")

        manifest = Path("app/src/debug/AndroidManifest.xml")
        m = manifest.read_text(encoding="utf-8")
        assert m.count("NaviPilot Taiwan 4.9.6") == 1
        manifest.write_text(m.replace("NaviPilot Taiwan 4.9.6", "NaviPilot Taiwan 4.9.7", 1), encoding="utf-8")
        for marker in ("npAttachSplitPanes()", "npUpdateSplitWeights(next)",
                       "npSwapSplitPanes()", "np_split_reversed", "MotionEvent.ACTION_MOVE",
                       "v.performClick()", "content.addView(mapPanel, mapLp)"):
            assert marker in s, marker
        print("v4.9.7 split-handle patch applied: drag 30..85%, tap swap, saved orientation and ratio.")
        NP_497_PY
        python3 -m py_compile /tmp/np_patch_v497.py
        python3 /tmp/np_patch_v497.py
        grep -q 'versionName = "4.9.7-drag-swap-split"' app/build.gradle.kts
    - name: Compile signed v4.9.7 APK (Gradle network retry)
      shell: bash
      run: |
        set -euo pipefail
        chmod +x gradlew
        # The repository uses Gradle 9.2.1. The wrapper's default network timeout
        # can fail on temporary GitHub runner / services.gradle.org slowdowns.
        WRAPPER_PROPERTIES=gradle/wrapper/gradle-wrapper.properties
        test -f "$WRAPPER_PROPERTIES"
        if grep -Eq '^networkTimeout=' "$WRAPPER_PROPERTIES"; then
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$WRAPPER_PROPERTIES"
        else
          printf '\nnetworkTimeout=120000\n' >> "$WRAPPER_PROPERTIES"
        fi
        for attempt in 1 2 3; do
          echo "Gradle assemble attempt $attempt of 3"
          if ./gradlew :app:assembleDebug --no-daemon --stacktrace; then
            echo "Gradle build succeeded on attempt $attempt"
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then
            echo "Gradle failed; waiting 15 seconds before retry (covers transient distribution/network errors)."
            sleep 15
          fi
        done
        echo "Gradle failed on all 3 attempts. Please inspect the full build log; a Kotlin compile error will also fail repeatedly."
        exit 1
    - name: Verify signed package identity
      shell: bash
      run: |
        set -euo pipefail
        APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
        test -n "$APK"
        "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.jixiexiaoge.drivingassist.taiwan'"
        "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
        echo 'Verified stable ID and APK signing.'
    - name: Upload signed NaviPilot v4.9.7 APK
      uses: actions/upload-artifact@v4
      with:
        name: NaviPilot-Taiwan-Dashboard-v497-signed
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        retention-days: 14
