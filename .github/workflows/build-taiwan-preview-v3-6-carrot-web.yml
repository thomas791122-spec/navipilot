                  val instance = WebView(this)
                  web = instance
                  instance.settings.apply {
                      javaScriptEnabled = true  // Required by Carrot Web HUD/UI.
                      domStorageEnabled = true
                      allowFileAccess = false
                      allowContentAccess = false
                      setSupportMultipleWindows(false)
                      mixedContentMode = WebSettings.MIXED_CONTENT_NEVER_ALLOW
                      mediaPlaybackRequiresUserGesture = false
                  }
                  instance.webChromeClient = WebChromeClient()
                  instance.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                          if (request == null || !request.isForMainFrame) return false
                          val destination = request.url.toString()
                          val accepted = activeBase ?: return true
                          if (TaiwanCarrotWebUrl.sameDevice(destination, accepted)) return false
                          status.text = "已封鎖跳轉其他網站：$destination"
                          return true
                      }

                      override fun onPageFinished(view: WebView?, url: String?) {
                          status.text = "Carrot Web 已載入：${url.orEmpty()}。影像與胎壓是否出現取決於車端網頁。"
                      }

                      override fun onReceivedError(view: WebView?, request: WebResourceRequest?, error: WebResourceError?) {
                          if (request?.isForMainFrame == true) {
                              status.text = "無法開啟 C4 網頁：${error?.description ?: "網路錯誤"}。請確認 C4 IP、Wi-Fi 和 :7000。"
                          }
                      }
                  }
                  webHolder.addView(instance, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                  status.text = "連接 $url …"
                  instance.loadUrl(url)
              }

              private fun updateNavigation() {
                  if (!::navigation.isInitialized) return
                  val recording = TaiwanPreviewSession.isRecording(this)
                  val p = getSharedPreferences(TaiwanMapsListener.PREFS, MODE_PRIVATE)
                  val fresh = System.currentTimeMillis() - p.getLong("last_time", 0L) in 0..15_000L
                  val text = if (recording && fresh) p.getString("last_text", "").orEmpty()
                      else "尚無新鮮 Google Maps 導航通知"
                  navigation.text = "Google ${if (recording) "● 記錄中" else "■ 已停止"}｜" + text.take(140)
              }

              private fun releaseWeb(reason: String) {
                  val old = web
                  web = null
                  activeBase = null
                  if (old != null) {
                      old.stopLoading()
                      webHolder.removeView(old)
                      old.loadUrl("about:blank")
                      old.onPause()
                      old.destroy()
                  }
                  if (::status.isInitialized) status.text = reason
              }

              override fun onResume() {
                  super.onResume()
                  handler.removeCallbacks(ticker)
                  handler.post(ticker)
              }

              override fun onPause() {
                  handler.removeCallbacks(ticker)
                  // User switched to Google Maps / home. The notification listener is independent;
                  // stop video immediately to avoid battery use and background WebView memory.
                  releaseWeb("切換到背景，已停止 Web 影像（導航通知仍可在背景接收）")
                  super.onPause()
              }

              override fun onDestroy() {
                  handler.removeCallbacks(ticker)
                  releaseWeb("畫面已關閉")
                  super.onDestroy()
              }
          }
