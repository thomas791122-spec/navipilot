name: Build NaviPilot Taiwan Preview v3.6 (Carrot Web embedded + TPMS preview)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout existing NaviPilot source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject Taiwan read-only preview (not committed)
        shell: bash
        run: |
          mkdir -p "app/src/main/java/com/jixiexiaoge/drivingassist"
          cat > 'app/src/main/java/com/jixiexiaoge/drivingassist/TaiwanCameraCatalog.kt' <<'TW_PREVIEW_EOF_0'
          package com.jixiexiaoge.drivingassist
          
          import kotlin.math.*
          
          /** Official open-data fixed-camera points. Read-only proximity preview; never controls the vehicle. */
          internal object TaiwanCameraCatalog {
              data class Camera(
                  val latitude: Double,
                  val longitude: Double,
                  val address: String,
                  val direction: String,
                  val speedLimit: String,
              )
              data class Nearby(val camera: Camera, val meters: Int)
          
              /** Handles RFC4180-style double quotes, quoted commas, newlines and UTF-8 BOM. */
              fun parseCsv(csv: String): List<Camera> {
                  val rows = parseRows(csv)
                  if (rows.isEmpty()) return emptyList()
                  fun normalize(s: String) = s.trim().removePrefix("\uFEFF")
                      .lowercase().replace(" ", "").replace("_", "").replace("-", "")
                  val columns = rows.first().map(::normalize)
                  fun col(vararg names: String) = columns.indexOfFirst { it in names.map(::normalize) }
                  val lat = col("latitude", "緯度", "座標緯度")
                  val lon = col("longitude", "經度", "座標經度")
                  val addr = col("address", "設置地址", "設置地點", "設置位置")
                  val direction = col("direct", "拍攝方向", "拍攝行向")
                  val limit = col("limit", "速限", "速限-速度限制")
                  if (lat < 0 || lon < 0) return emptyList()
                  return rows.drop(1).mapNotNull { row ->
                      val y = row.getOrNull(lat)?.trim()?.toDoubleOrNull() ?: return@mapNotNull null
                      val x = row.getOrNull(lon)?.trim()?.toDoubleOrNull() ?: return@mapNotNull null
                      if (y !in 20.0..27.0 || x !in 117.0..124.0) return@mapNotNull null
                      Camera(
                          latitude = y,
                          longitude = x,
                          address = row.getOrNull(addr)?.trim().orEmpty(),
                          direction = row.getOrNull(direction)?.trim().orEmpty(),
                          speedLimit = row.getOrNull(limit)?.trim().orEmpty(),
                      )
                  }.distinctBy { Triple(it.latitude, it.longitude, it.address) }
              }
          
              fun nearest(points: List<Camera>, lat: Double, lon: Double, radiusMeters: Int = 2000): List<Nearby> =
                  points.map { Nearby(it, distanceMeters(lat, lon, it.latitude, it.longitude).roundToInt()) }
                      .filter { it.meters <= radiusMeters }
                      .sortedBy { it.meters }
                      .take(3)
          
              private fun parseRows(content: String): List<List<String>> {
                  val result = mutableListOf<List<String>>()
                  val row = mutableListOf<String>()
                  val cell = StringBuilder()
                  var quoted = false
                  var i = 0
                  while (i < content.length) {
                      when (val c = content[i]) {
                          '"' -> if (quoted && i + 1 < content.length && content[i + 1] == '"') {
                              cell.append('"'); i++
                          } else quoted = !quoted
                          ',' -> if (quoted) cell.append(c) else { row.add(cell.toString()); cell.setLength(0) }
                          '\n' -> if (quoted) cell.append(c) else {
                              row.add(cell.toString().trimEnd('\r')); cell.setLength(0)
                              if (row.any { it.isNotEmpty() }) result.add(row.toList())
                              row.clear()
                          }
                          else -> cell.append(c)
                      }
                      i++
                  }
                  row.add(cell.toString().trimEnd('\r'))
                  if (row.any { it.isNotEmpty() }) result.add(row.toList())
                  return result
              }
          
              private fun distanceMeters(aLat: Double, aLon: Double, bLat: Double, bLon: Double): Double {
                  val latDelta = Math.toRadians(bLat - aLat)
                  val lonDelta = Math.toRadians(bLon - aLon)
                  val h = sin(latDelta / 2).pow(2) + cos(Math.toRadians(aLat)) *
                      cos(Math.toRadians(bLat)) * sin(lonDelta / 2).pow(2)
                  return 6_371_000.0 * 2 * asin(sqrt(h.coerceIn(0.0, 1.0)))
              }
          }
          
          internal object TaiwanGoogleNavHint {
              /** Google Maps notification wording varies by version/language; result is for diagnosis only. */
              fun summarize(raw: String): String {
                  val event = when {
                      listOf("右轉", "turn right").any { raw.contains(it, true) } -> "可能右轉"
                      listOf("左轉", "turn left").any { raw.contains(it, true) } -> "可能左轉"
                      listOf("出口", "exit").any { raw.contains(it, true) } -> "可能出口"
                      listOf("迴轉", "u-turn").any { raw.contains(it, true) } -> "可能迴轉"
                      else -> "無法可靠判斷方向"
                  }
                  val dist = Regex("(\\d+(?:\\.\\d+)?)\\s*(公里|km|公尺|米|m)", RegexOption.IGNORE_CASE).find(raw)
                  val distance = dist?.value ?: "未取得距離"
                  return "$event · $distance（僅供觀察，不是控制指令）"
              }
          }
          TW_PREVIEW_EOF_0
          mkdir -p "app/src/main/java/com/jixiexiaoge/drivingassist"
          cat > 'app/src/main/java/com/jixiexiaoge/drivingassist/TaiwanNavLogger.kt' <<'TW_PREVIEW_LOG_EOF'
          package com.jixiexiaoge.drivingassist
          
          import android.content.Context
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          
          /** Debug-only rolling, local history of Google Maps notifications. No commands to comma. */
          internal object TaiwanNavLogger {
              private const val PREFS = "taiwan_preview_debug_history"
              private const val KEY = "events"
              private const val MAX_CHARS = 12_000
              private var lastGoogleContent = ""
              private var lastGoogleAtMs = 0L
          
              @Synchronized
              fun append(context: Context, category: String, message: String) {
                  val nowMs = System.currentTimeMillis()
                  // Google Maps can republish the same notification repeatedly.
                  // Keep changed navigation events, but sample at most once per second.
                  if (category == "GOOGLE_POST") {
                      if (message == lastGoogleContent && nowMs - lastGoogleAtMs in 0..10_000) return
                      if (nowMs - lastGoogleAtMs in 0..2_000) return
                      lastGoogleContent = message
                      lastGoogleAtMs = nowMs
                  }
                  val whenLocal = SimpleDateFormat("MM-dd HH:mm:ss.SSS", Locale.TAIWAN).format(Date())
                  val safe = message.replace('\n', ' ').replace('\r', ' ').take(1000)
                  val entry = "$whenLocal [$category] $safe\n"
                  val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val old = prefs.getString(KEY, "").orEmpty()
                  val combined = (old + entry).takeLast(MAX_CHARS)
                  prefs.edit().putString(KEY, combined).apply()
              }
          
              @Synchronized
              fun dump(context: Context): String {
                  val content = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .getString(KEY, "").orEmpty()
                  val crash = lastCrash(context).ifBlank { "（未記錄到 Java/Kotlin 閃退；系統強制終止或記憶體不足可能無法記錄）" }
                  return "NaviPilot Taiwan Preview v3.6 — 背景／停止／轉向診斷\n" +
                      "僅觀察，無車輛控制。分享前請檢查路名及目的地等隱私。\n" +
                      "上次程式閃退：\n$crash\n\n" +
                      "通知歷史（最多 $MAX_CHARS 字元）：\n" +
                      content.ifBlank { "目前沒有紀錄。" }
              }
          
              @Synchronized
              fun countChars(context: Context): Int =
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .getString(KEY, "").orEmpty().length

              @Synchronized
              fun lastCrash(context: Context): String =
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .getString("last_crash", "").orEmpty()

              @Synchronized
              fun clear(context: Context) {
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                      .remove(KEY).remove("last_crash").apply()
              }
          }
          TW_PREVIEW_LOG_EOF
          mkdir -p "app/src/main/java/com/jixiexiaoge/drivingassist"
          cat > 'app/src/main/java/com/jixiexiaoge/drivingassist/TaiwanPreviewApplication.kt' <<'TW_APP_DIAGNOSTIC_EOF'
          package com.jixiexiaoge.drivingassist

          import android.app.Application

          /** Best-effort local crash summary. The original crash handler still runs. */
          class TaiwanPreviewApplication : Application() {
              override fun onCreate() {
                  super.onCreate()
                  val previous = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, error ->
                      try {
                          val trace = error.stackTrace.take(8).joinToString(" | ")
                          val detail = "${error.javaClass.simpleName}: ${error.message.orEmpty().take(240)} | $trace"
                          getSharedPreferences("taiwan_preview_debug_history", MODE_PRIVATE)
                              .edit().putString("last_crash", detail.take(1300)).commit()
                      } catch (_: Throwable) { /* Low-memory crashes may not be recordable. */ }
                      if (previous != null) previous.uncaughtException(thread, error)
                      else android.os.Process.killProcess(android.os.Process.myPid())
                  }
              }
          }
          TW_APP_DIAGNOSTIC_EOF
          mkdir -p "app/src/main/java/com/jixiexiaoge/drivingassist"
          mkdir -p "app/src/main/java/com/jixiexiaoge/drivingassist"
          cat > 'app/src/main/java/com/jixiexiaoge/drivingassist/TaiwanPreviewSession.kt' <<'TW_PREVIEW_SESSION_EOF'
          package com.jixiexiaoge.drivingassist

          import android.content.Context

          /** Explicit opt-in observation session. No remote Carrot commands. */
          internal object TaiwanPreviewSession {
              private const val PREFS = "tw_preview_v35_session"
              private const val NO_PROGRESS_TIMEOUT_MS = 20 * 60 * 1000L

              fun isRecording(context: Context): Boolean =
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .getBoolean("recording", false)

              @Synchronized
              fun start(context: Context) {
                  val now = System.currentTimeMillis()
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                      .putBoolean("recording", true)
                      .putLong("started_ms", now)
                      .putLong("last_progress_ms", now)
                      .putLong("last_notification_ms", 0L)
                      .remove("road")
                      .remove("distance_m")
                      .putString("reason", "user_started")
                      .apply()
                  TaiwanNavLogger.append(context, "SESSION", "started; background_notification_only")
              }

              @Synchronized
              fun stop(context: Context, reason: String) {
                  if (!isRecording(context)) return
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                      .putBoolean("recording", false)
                      .putString("reason", reason.take(60))
                      .apply()
                  context.getSharedPreferences(TaiwanMapsListener.PREFS, Context.MODE_PRIVATE)
                      .edit().putBoolean("active", false).apply()
                  TaiwanNavLogger.append(context, "SESSION", "stopped reason=$reason")
              }

              fun status(context: Context): String {
                  val p = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val since = p.getLong("last_notification_ms", 0L)
                  val last = if (since == 0L) "尚未收到導航通知" else
                      "最後通知 ${((System.currentTimeMillis() - since).coerceAtLeast(0L) / 1000L)} 秒前"
                  return if (p.getBoolean("recording", false)) "記錄中（可背景接收） · $last" else
                      "已停止／待機（${p.getString("reason", "尚未開始")}）"
              }

              fun parseDistanceMeters(raw: String): Int? {
                  val hit = Regex("""^\s*(\d+(?:\.\d+)?)\s*(公尺|公里|km|m)""", RegexOption.IGNORE_CASE)
                      .find(raw) ?: return null
                  val num = hit.groupValues[1].toDoubleOrNull() ?: return null
                  val unit = hit.groupValues[2].lowercase()
                  val meters = if (unit == "公里" || unit == "km") num * 1000 else num
                  return meters.takeIf { it.isFinite() && it in 0.0..2000000.0 }?.toInt()
              }

              @Synchronized
              fun acceptNavigation(context: Context, fields: List<Pair<String, String>>): Boolean {
                  val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  if (!prefs.getBoolean("recording", false)) return false
                  val now = System.currentTimeMillis()
                  val progress = prefs.getLong("last_progress_ms", now)
                  if (now - progress > NO_PROGRESS_TIMEOUT_MS) {
                      stop(context, "no_navigation_progress_20min")
                      return false
                  }
                  val title = fields.firstOrNull { it.first == "title" }?.second.orEmpty()
                  val road = fields.firstOrNull { it.first == "text" }?.second.orEmpty().take(150)
                  val distance = parseDistanceMeters(title)
                  val oldRoad = prefs.getString("road", "").orEmpty()
                  val oldDistance = prefs.getInt("distance_m", -1)
                  val changed = (road.isNotBlank() && road != oldRoad) ||
                      (distance != null && distance != oldDistance)
                  val lastWritten = prefs.getLong("last_notification_ms", 0L)
                  if (changed || now - lastWritten > 5_000L) {
                      prefs.edit().apply {
                          putLong("last_notification_ms", now)
                          if (changed) {
                              putLong("last_progress_ms", now)
                              if (road.isNotBlank()) putString("road", road)
                              if (distance != null) putInt("distance_m", distance)
                          }
                      }.apply()
                  }
                  return true
              }

              @Synchronized
              fun pauseIfIdle(context: Context) {
                  if (!isRecording(context)) return
                  val p = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val progress = p.getLong("last_progress_ms", System.currentTimeMillis())
                  if (System.currentTimeMillis() - progress > NO_PROGRESS_TIMEOUT_MS)
                      stop(context, "no_navigation_progress_20min")
              }
          }
          TW_PREVIEW_SESSION_EOF
          cat > 'app/src/main/java/com/jixiexiaoge/drivingassist/TaiwanMapsListener.kt' <<'TW_PREVIEW_EOF_1'
          package com.jixiexiaoge.drivingassist
          
          import android.app.Notification
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.drawable.Icon
          import java.io.File
          import java.io.FileOutputStream
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          
          /** Read-only Google Maps notification observer. NEVER sends driving/control commands. */
          class TaiwanMapsListener : NotificationListenerService() {
              private val mainHandler = android.os.Handler(android.os.Looper.getMainLooper())
              private var pendingStop: Runnable? = null
              private var lastAcceptedNotificationId: Int? = null
              private var lastIconSampleMs = 0L
              private var lastIconHash: Int? = null
              private var lastErrorMs = 0L
              private var skippedErrors = 0

              /** Report the first actual exception site, not hundreds of identical messages. */
              private fun logNotifyError(stage: String, e: RuntimeException) {
                  val now = android.os.SystemClock.elapsedRealtime()
                  if (lastErrorMs != 0L && now - lastErrorMs < 30_000L) {
                      skippedErrors++
                      return
                  }
                  val site = e.stackTrace.firstOrNull()?.let {
                      "${it.className.substringAfterLast('.')}.${it.methodName}:${it.lineNumber}"
                  }.orEmpty()
                  val detail = "stage=$stage kind=${e.javaClass.simpleName} " +
                      "message=${e.message.orEmpty().replace('\n', ' ').take(160)} " +
                      "at=$site skipped=$skippedErrors"
                  lastErrorMs = now
                  skippedErrors = 0
                  TaiwanNavLogger.append(this, "NOTIFY_ERROR", detail)
              }

              /** Draw only the Google navigation notification's small icon into a fixed 96x96 preview.
               *  No screenshots, route image capture, or vehicle control.
               */
              private fun sampleTurnIcon(notification: Notification) {
                  val now = android.os.SystemClock.elapsedRealtime()
                  if (now - lastIconSampleMs in 0..4000L) return
                  lastIconSampleMs = now
                  val icon = notification.smallIcon ?: return
                  try {
                      // TYPE_BITMAP=1 in Android. Do not call getResId() on this type.
                      val drawable = icon.loadDrawable(this) ?: return
                      val bitmap = Bitmap.createBitmap(96, 96, Bitmap.Config.ARGB_8888)
                      try {
                          drawable.setBounds(0, 0, 96, 96)
                          drawable.draw(Canvas(bitmap))
                          var fingerprint = 1
                          for (y in 0 until 96 step 8) {
                              for (x in 0 until 96 step 8) fingerprint = 31 * fingerprint + bitmap.getPixel(x, y)
                          }
                          if (fingerprint != lastIconHash) {
                              FileOutputStream(File(filesDir, "taiwan_nav_turn_icon.png")).use {
                                  bitmap.compress(Bitmap.CompressFormat.PNG, 100, it)
                              }
                              lastIconHash = fingerprint
                              getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                                  .putLong("last_icon_time", System.currentTimeMillis())
                                  .putString("last_icon_hash", Integer.toHexString(fingerprint))
                                  .apply()
                              TaiwanNavLogger.append(this, "ICON_SAMPLE", "type=${icon.type} hash=${Integer.toHexString(fingerprint)}")
                          }
                      } finally { bitmap.recycle() }
                  } catch (e: RuntimeException) {
                      logNotifyError("icon_preview", e)
                  }
              }

              override fun onListenerConnected() {
                  super.onListenerConnected()
                  TaiwanNavLogger.append(this, "SYSTEM", "notification_listener_connected")
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  if (sbn?.packageName != GOOGLE_MAPS_PACKAGE) return
                  if (!TaiwanPreviewSession.isRecording(this)) return
                  pendingStop?.let { mainHandler.removeCallbacks(it) }
                  pendingStop = null
                  try {
                      val notification = sbn.notification
                      val extras = notification.extras ?: return
                      val requestedFields = listOf(
                          "title" to Notification.EXTRA_TITLE,
                          "text" to Notification.EXTRA_TEXT,
                          "big_text" to Notification.EXTRA_BIG_TEXT,
                          "sub_text" to Notification.EXTRA_SUB_TEXT,
                          "summary_text" to Notification.EXTRA_SUMMARY_TEXT,
                          "info_text" to Notification.EXTRA_INFO_TEXT,
                      )
                      val fields = requestedFields.mapNotNull { (label, key) ->
                          try {
                              extras.getCharSequence(key)?.toString()?.take(500)
                                  ?.takeIf { it.isNotBlank() }?.let { label to it }
                          } catch (e: RuntimeException) {
                              logNotifyError("text:$label", e)
                              null
                          }
                      }
                      val lines = try {
                          extras.getCharSequenceArray(Notification.EXTRA_TEXT_LINES)
                              ?.take(4)?.joinToString(" / ") { it.toString().take(120) }
                              .orEmpty()
                      } catch (e: RuntimeException) {
                          logNotifyError("text_lines", e)
                          ""
                      }
                      val iconInfo = try {
                          val icon = notification.smallIcon
                          when {
                              icon == null -> "none"
                              icon.type == android.graphics.drawable.Icon.TYPE_RESOURCE -> "resource:${icon.resId}"
                              else -> "type:${icon.type}" // getResId() throws unless TYPE_RESOURCE
                          }
                      } catch (e: RuntimeException) {
                          logNotifyError("small_icon", e)
                          "unavailable"
                      }
                      if (!TaiwanPreviewSession.acceptNavigation(this, fields)) return
                      lastAcceptedNotificationId = sbn.id
                      // Fixed-size icon preview; no image or vehicle data is transmitted.
                      sampleTurnIcon(notification)
                      // Do NOT enumerate arbitrary Parcel-backed extras / actions for every update.
                      val meta = "id=${sbn.id} icon=$iconInfo"
                      TaiwanNavLogger.append(
                          this, "GOOGLE_POST",
                          "${fields.joinToString(" | ") { "${it.first}=${it.second}" }} | lines=$lines | $meta"
                      )
                      val parts = fields.filter { it.first in listOf("title", "text", "big_text", "sub_text") }
                          .map { it.second }.distinct()
                      if (parts.isEmpty()) return
                      getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                          .putString("last_text", parts.joinToString(" | ").take(1500))
                          .putLong("last_time", System.currentTimeMillis())
                          .putBoolean("active", true)
                          .apply()
                  } catch (e: RuntimeException) {
                      logNotifyError("onNotificationPosted", e)
                  }
              }

              override fun onNotificationRemoved(sbn: StatusBarNotification?) {
                  if (sbn?.packageName != GOOGLE_MAPS_PACKAGE) return
                  if (!TaiwanPreviewSession.isRecording(this)) return
                  if (lastAcceptedNotificationId != sbn.id) return
                  try {
                      TaiwanNavLogger.append(this, "GOOGLE_REMOVE", "id=${sbn.id}; grace_period=90sec")
                      getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                          .putBoolean("active", false).apply()
                      pendingStop?.let { mainHandler.removeCallbacks(it) }
                      val task = Runnable {
                          // Another Google Maps navigation update cancels this runnable.
                          TaiwanPreviewSession.stop(this, "navigation_notification_removed_90sec")
                      }
                      pendingStop = task
                      mainHandler.postDelayed(task, 90_000L)
                  } catch (e: RuntimeException) {
                      logNotifyError("onNotificationRemoved", e)
                  }
              }

              override fun onDestroy() {
                  pendingStop?.let { mainHandler.removeCallbacks(it) }
                  pendingStop = null
                  super.onDestroy()
              }

              companion object {
                  const val PREFS = "taiwan_navigation_preview"
                  const val GOOGLE_MAPS_PACKAGE = "com.google.android.apps.maps"
              }
          }
          TW_PREVIEW_EOF_1
