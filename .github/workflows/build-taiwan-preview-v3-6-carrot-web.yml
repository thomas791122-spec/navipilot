          import android.content.pm.PackageManager
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ImageView
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.io.File
          import java.net.URL
          import kotlin.concurrent.thread
          
          /** Separate TEST launcher. It never calls NaviStreamManager, 7706, 7714, or any control API. */
          class TaiwanPreviewActivity : Activity() {
              private lateinit var report: TextView
              private lateinit var sessionStatus: TextView
              private lateinit var liveSummary: TextView
              private lateinit var logView: TextView
              private lateinit var iconPreview: ImageView
              private var lastIconFileModifiedMs = 0L
              private lateinit var locationManager: LocationManager
              private val uiHandler = Handler(Looper.getMainLooper())
              private var lastLocation: Location? = null
              private var locationListening = false
              private var locationPermissionRequested = false
              private var firstGpsFixLogged = false
              private var lastGpsUiAtMs = 0L
              private var cameras: List<TaiwanCameraCatalog.Camera> = emptyList()
              private var loading = false
              private val locationListener = object : LocationListener {
                  override fun onLocationChanged(location: Location) {
                      lastLocation = location
                      if (!firstGpsFixLogged) {
                          firstGpsFixLogged = true
                          val acc = if (location.hasAccuracy()) "${location.accuracy.toInt()}m" else "unknown"
                          // Do not persist GPS coordinates in the shared diagnostic log.
                          TaiwanNavLogger.append(this@TaiwanPreviewActivity, "GPS", "first_fix accuracy=$acc provider=${location.provider}")
                      }
                      val now = android.os.SystemClock.uptimeMillis()
                      if (now - lastGpsUiAtMs >= 2000L) {
                          lastGpsUiAtMs = now
                          showReport()
                      }
                  }
              }
              private val refreshTask = object : Runnable {
                  override fun run() {
                      showReport()
                      uiHandler.postDelayed(this, if (TaiwanPreviewSession.isRecording(this@TaiwanPreviewActivity)) 2500 else 30000)
                  }
