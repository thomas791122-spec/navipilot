          package com.jixiexiaoge.drivingassist

          import java.net.URI

          /** Carrot Web is a same-Wi-Fi local service. Block all non-local destinations. */
          internal object TaiwanCarrotWebUrl {
              fun normalize(rawInput: String): String? {
                  val input = rawInput.trim()
                  if (input.isBlank()) return null
                  val candidate = if (input.startsWith("http://", ignoreCase = true)) input
                      else if (input.contains("://")) return null else "http://$input"
                  val uri = runCatching { URI(candidate) }.getOrNull() ?: return null
                  if (uri.scheme != "http" || uri.userInfo != null || uri.fragment != null) return null
                  val host = uri.host ?: return null
                  if (!isPrivateHost(host) || uri.port !in listOf(-1, 7000)) return null
                  return "http://$host:7000/"
              }

              fun sameDevice(url: String, acceptedBase: String): Boolean {
                  val request = runCatching { URI(url) }.getOrNull() ?: return false
                  val base = runCatching { URI(acceptedBase) }.getOrNull() ?: return false
                  return request.scheme == "http" && request.host?.equals(base.host, ignoreCase = true) == true &&
                      request.port == 7000 && request.userInfo == null
              }

              private fun isPrivateHost(host: String): Boolean {
                  if (host.endsWith(".local", ignoreCase = true) && host.length > 6) return true
                  val parts = host.split('.')
                  if (parts.size != 4) return false
                  val ip = parts.map { it.toIntOrNull() ?: return false }
                  if (ip.any { it !in 0..255 }) return false
                  return ip[0] == 10 ||
                      (ip[0] == 172 && ip[1] in 16..31) ||
                      (ip[0] == 192 && ip[1] == 168) ||
                      (ip[0] == 169 && ip[1] == 254)
              }
          }
