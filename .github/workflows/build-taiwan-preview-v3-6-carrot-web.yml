              private fun hasAnyLocationPermission(): Boolean =
                  checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED ||
                  checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED
          
              private fun requestLocation() {
                  if (!TaiwanPreviewSession.isRecording(this)) {
                      showReport()
                      return
                  }
                  val fineGranted = checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
                  val coarseGranted = checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED
                  if (!fineGranted && !coarseGranted) {
                      if (!locationPermissionRequested) {
                          locationPermissionRequested = true
                          TaiwanNavLogger.append(this, "GPS", "requesting_foreground_location_permission")
                          // Android 12+ requires FINE and COARSE to be requested together.
                          requestPermissions(arrayOf(
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION,
                          ), GPS_PERMISSION)
                      } else {
                          Toast.makeText(this, "請到 Android 設定允許定位權限", Toast.LENGTH_LONG).show()
                      }
                      showReport()
                      return
                  }
                  if (locationListening) return
                  try {
                      val providers = listOf(LocationManager.GPS_PROVIDER, LocationManager.NETWORK_PROVIDER)
                          .filter { it != LocationManager.GPS_PROVIDER || fineGranted }
                          .filter { locationManager.isProviderEnabled(it) }
                      if (providers.isEmpty()) {
                          TaiwanNavLogger.append(this, "GPS", "no_available_location_provider")
                          Toast.makeText(this, "請開啟手機系統定位功能", Toast.LENGTH_LONG).show()
                          showReport()
                          return
                      }
                      providers.forEach { provider ->
                          locationManager.requestLocationUpdates(provider, 2000L, 5f, locationListener)
                          locationManager.getLastKnownLocation(provider)?.let { candidate ->
                              if (lastLocation == null || candidate.time > lastLocation!!.time) lastLocation = candidate
                          }
                      }
                      locationListening = true
                      TaiwanNavLogger.append(this, "GPS", "started provider=${providers.joinToString("+")} fine=$fineGranted coarse=$coarseGranted")
                      showReport()
                  } catch (e: SecurityException) {
                      TaiwanNavLogger.append(this, "GPS", "security_exception")
                      Toast.makeText(this, "定位權限不足", Toast.LENGTH_SHORT).show()
                  } catch (e: IllegalArgumentException) {
                      TaiwanNavLogger.append(this, "GPS", "location_provider_unavailable")
                      Toast.makeText(this, "定位提供者不可用", Toast.LENGTH_SHORT).show()
                  }
              }
          
              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == GPS_PERMISSION) {
                      val granted = hasAnyLocationPermission()
                      TaiwanNavLogger.append(this, "GPS", "permission_result granted=$granted precise=${checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED}")
                      if (granted) requestLocation() else showReport()
                  }
              }
          
              @Deprecated("Compatibility with Android document picker")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != IMPORT_CSV || resultCode != RESULT_OK) return
                  val uri = data?.data ?: return
                  try {
                      val content = contentResolver.openInputStream(uri)?.bufferedReader(Charsets.UTF_8)?.use { it.readText() }
                      if (content != null) loadCsv(content, "使用者匯入的 CSV")
                  } catch (e: Exception) { report.text = "讀取 CSV 失敗：${e.javaClass.simpleName}" }
              }
          
              private fun downloadOfficialCsv() {
                  if (loading) return
                  loading = true
                  showReport()
                  thread(name = "TaiwanCameraCsvDownload") {
                      val result = runCatching {
                          val conn = URL(OFFICIAL_CSV).openConnection().apply {
                              connectTimeout = 15000
                              readTimeout = 20000
                          }
                          val data = conn.getInputStream().use { stream ->
                              stream.bufferedReader(Charsets.UTF_8).readText()
                          }
                          if (data.length > 6_000_000) throw IllegalStateException("CSV 檔案過大")
                          data
                      }
                      runOnUiThread {
                          loading = false
                          result.onSuccess { loadCsv(it, "警政署公開 CSV") }
                              .onFailure { report.text = "下載失敗（${it.javaClass.simpleName}）。可從 data.gov.tw/dataset/7320 下載 CSV，再按第 5 項匯入。" }
                      }
                  }
              }
          
              private fun loadCsv(csv: String, from: String) {
                  val parsed = TaiwanCameraCatalog.parseCsv(csv)
                  if (parsed.isEmpty()) {
                      report.text = "未能解析固定測速點。需包含 Latitude、Longitude、Address、direct、limit 欄位。"
                      return
                  }
                  cameras = parsed
                  File(filesDir, FILE_NAME).writeText(csv)
                  Toast.makeText(this, "$from：載入 ${parsed.size} 筆", Toast.LENGTH_LONG).show()
                  showReport()
              }
          
              private fun showReport() {
                  if (!::report.isInitialized) return
                  TaiwanPreviewSession.pauseIfIdle(this)
                  if (::sessionStatus.isInitialized) sessionStatus.text =
                      "狀態：${TaiwanPreviewSession.status(this)}\n" +
                      "背景模式：只收 Google Maps 通知，背景不讀 GPS。\n" +
                      "導航停止或 20 分鐘無距離進度時自動待機（受 Android 排程限制）。"
                  if (::liveSummary.isInitialized) {
                      val latest = getSharedPreferences(TaiwanMapsListener.PREFS, MODE_PRIVATE)
                      liveSummary.text = "導航資訊：\n" + latest.getString("last_text", "尚無 Google Maps 通知")
                  }
                  val iconFile = File(filesDir, "taiwan_nav_turn_icon.png")
                  if (::iconPreview.isInitialized && iconFile.isFile &&
                      iconFile.lastModified() != lastIconFileModifiedMs) {
                      try {
                          val bitmap = BitmapFactory.decodeFile(iconFile.absolutePath)
                          if (bitmap != null) {
                              iconPreview.setImageBitmap(bitmap)
                              lastIconFileModifiedMs = iconFile.lastModified()
                          }
                      } catch (_: RuntimeException) { /* Let later refresh retry. */ }
                  }
                  val prefs = getSharedPreferences(TaiwanMapsListener.PREFS, MODE_PRIVATE)
                  val raw = prefs.getString("last_text", "").orEmpty()
                  val stamp = prefs.getLong("last_time", 0)
                  val elapsed = System.currentTimeMillis() - stamp
                  val fresh = TaiwanPreviewSession.isRecording(this) && raw.isNotBlank() &&
                      elapsed in 0..15_000 && prefs.getBoolean("active", false)
                  val location = lastLocation
                  val locationPermission = when {
                      checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED -> "精確定位已授權"
                      checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED -> "只有約略定位（測速匹配可能不準）"
                      else -> "未授權（請按第 3 項或到手機設定開啟）"
                  }
                  val cameraText = if (location == null) "尚未取得 GPS 位置" else {
                      val age = System.currentTimeMillis() - location.time
                      if (age !in 0..30_000 || (location.hasAccuracy() && location.accuracy > 100f)) {
                          "GPS 過期或精度不足：不顯示測速點"
                      } else {
                          val nearby = TaiwanCameraCatalog.nearest(cameras, location.latitude, location.longitude)
                          if (nearby.isEmpty()) "目前直線 2 公里內未找到資料庫測速點" else nearby.joinToString("\n") {
                              "約 ${it.meters} m｜速限 ${it.camera.speedLimit.ifBlank { "未知" }}｜${it.camera.address}｜${it.camera.direction}"
                          }
                      }
                  }
                  val runtime = Runtime.getRuntime()
                  val heapUsed = ((runtime.totalMemory() - runtime.freeMemory()) / 1_048_576L)
                  val heapCap = runtime.maxMemory() / 1_048_576L
                  val crash = TaiwanNavLogger.lastCrash(this).let { if (it.isBlank()) "無／尚未記錄" else it.take(300) }
                  report.text = """
                      本工具只觀察資料，不向 comma 4 傳送導航／速度／煞車／變道指令。
                      背景使用限制：切回 Google 地圖後，通知接收可持續，但 GPS 更新會停止。
          
                      Google Maps 通知：${if (fresh) "最近 15 秒有效" else "尚無新鮮資料／通知已移除"}
                      原始文字：${raw.ifBlank { "（請啟動 Google Maps 導航並授權通知存取）" }}
                      解析預覽：${TaiwanGoogleNavHint.summarize(raw)}
                      圖示最後更新：${prefs.getLong("last_icon_time", 0).let { if (it == 0L) "尚未取得" else java.text.SimpleDateFormat("HH:mm:ss", java.util.Locale.TAIWAN).format(java.util.Date(it)) }}
                      圖示指紋：${prefs.getString("last_icon_hash", "未知")}（只供不同轉向圖示比對，不代表方向）
          
                      台灣固定測速資料：${cameras.size} 筆 ${if (loading) "（下載中）" else ""}
                      定位權限：$locationPermission
                      記憶體觀察：Java heap $heapUsed / $heapCap MB（不等於系統快取）
                      Log 長度：${TaiwanNavLogger.countChars(this)} / 12000 字元
                      上次閃退摘要：$crash
                      GPS：${location?.let { "${it.latitude}, ${it.longitude}" } ?: "未啟用"}
                      鄰近測速點（僅 GPS 直線距離）：
                      $cameraText
          
                      注意：未驗證行車方向、上下匝道、平面與高架是否同一路線；距離不代表行車距離，也不代表速限正確。這些資料不可直接用於自動減速。
                      資料來源：內政部警政署「測速執法設置點」（data.gov.tw/dataset/7320）；非神盾官方資料。
                  """.trimIndent()
              }
          
