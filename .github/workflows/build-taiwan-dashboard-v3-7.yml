          </style></head><body><div id="map"><div id="tiles"></div><svg id="trace"></svg><div id="cams"></div><div id="center"></div><div id="empty">等待 GPS 取得位置…</div><div id="legend">藍色軌跡＝已行駛，不是 Google 規劃路線</div><div id="credits">© OpenStreetMap contributors</div></div><script>
          'use strict';let lat=null,lon=null,z=16,trail=[],cache={},cameras=[];const tiles=document.getElementById('tiles'),svg=document.getElementById('trace');
          function project(a,b){let scale=256*Math.pow(2,z),sin=Math.sin(a*Math.PI/180);return {x:(b+180)/360*scale,y:(.5-Math.log((1+sin)/(1-sin))/(4*Math.PI))*scale};}
          function update(a,b){if(!Number.isFinite(a)||!Number.isFinite(b)||Math.abs(a)>85||Math.abs(b)>180)return;lat=a;lon=b;document.getElementById('empty').style.display='none';let p=project(lat,lon);if(!trail.length||Math.abs(p.x-trail[trail.length-1].x)>8||Math.abs(p.y-trail[trail.length-1].y)>8){trail.push(p);if(trail.length>160)trail.shift();}render();}
          function render(){if(lat===null)return;const w=tiles.parentElement.clientWidth,h=tiles.parentElement.clientHeight,p=project(lat,lon),tx=Math.floor(p.x/256),ty=Math.floor(p.y/256),n=Math.pow(2,z),need={};const radiusX=Math.ceil(w/512)+1,radiusY=Math.ceil(h/512)+1;for(let dx=-radiusX;dx<=radiusX;dx++)for(let dy=-radiusY;dy<=radiusY;dy++){const ix=tx+dx,iy=ty+dy;if(iy<0||iy>=n)continue;const k=z+'-'+ix+'-'+iy;need[k]=true;let im=cache[k];if(!im){im=document.createElement('img');im.className='tile';im.alt='';im.decoding='async';im.loading='eager';im.src='https://tile.openstreetmap.org/'+z+'/'+((ix%n+n)%n)+'/'+iy+'.png';tiles.appendChild(im);cache[k]=im;}im.style.left=(ix*256-p.x+w/2)+'px';im.style.top=(iy*256-p.y+h/2)+'px';}for(const [key,im] of Object.entries(cache)){if(!need[key]){im.remove();delete cache[key];}}svg.setAttribute('viewBox','0 0 '+w+' '+h);let pts=trail.map(q=>(q.x-p.x+w/2).toFixed(1)+','+(q.y-p.y+h/2).toFixed(1)).join(' ');svg.innerHTML='<polyline fill="none" stroke="#168afa" stroke-width="4" opacity="0.8" points="'+pts+'"/>';const markers=document.getElementById("cams");markers.innerHTML="";for(const cam of cameras){let q=project(cam[0],cam[1]),mx=q.x-p.x+w/2,my=q.y-p.y+h/2;if(mx<0||my<0||mx>w||my>h)continue;let d=document.createElement("div");d.className="cam";d.style.left=mx+"px";d.style.top=my+"px";markers.appendChild(d);}}
          function setCameras(items){cameras=Array.isArray(items)?items.slice(0,25):[];render();}
          function setZoom(delta){z=Math.min(18,Math.max(13,z+delta));trail=[];for(const im of Object.values(cache))im.remove();cache={};render();}window.addEventListener('resize',render);
