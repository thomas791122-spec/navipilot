name: Build NaviPilot Taiwan Preview v2 (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout existing NaviPilot source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject Taiwan read-only preview (not committed)
        shell: bash
        run: |
          mkdir -p "app/src/main/java/com/jixiexiaoge/drivingassist"
          cat > 'app/src/main/java/com/jixiexiaoge/drivingassist/TaiwanCameraCatalog.kt' <<'TW_PREVIEW_EOF_0'
          package com.jixiexiaoge.drivingassist
          
          import kotlin.math.*
          
          /** Official open-data fixed-camera points. Read-only proximity preview; never controls the vehicle. */
          internal object TaiwanCameraCatalog {
              data class Camera(
                  val latitude: Double,
                  val longitude: Double,
                  val address: String,
                  val direction: String,
                  val speedLimit: String,
              )
              data class Nearby(val camera: Camera, val meters: Int)
          
              /** Handles RFC4180-style double quotes, quoted commas, newlines and UTF-8 BOM. */
              fun parseCsv(csv: String): List<Camera> {
                  val rows = parseRows(csv)
                  if (rows.isEmpty()) return emptyList()
                  fun normalize(s: String) = s.trim().removePrefix("\uFEFF")
                      .lowercase().replace(" ", "").replace("_", "").replace("-", "")
                  val columns = rows.first().map(::normalize)
                  fun col(vararg names: String) = columns.indexOfFirst { it in names.map(::normalize) }
                  val lat = col("latitude", "緯度", "座標緯度")
                  val lon = col("longitude", "經度", "座標經度")
                  val addr = col("address", "設置地址", "設置地點", "設置位置")
                  val direction = col("direct", "拍攝方向", "拍攝行向")
                  val limit = col("limit", "速限", "速限-速度限制")
                  if (lat < 0 || lon < 0) return emptyList()
                  return rows.drop(1).mapNotNull { row ->
                      val y = row.getOrNull(lat)?.trim()?.toDoubleOrNull() ?: return@mapNotNull null
                      val x = row.getOrNull(lon)?.trim()?.toDoubleOrNull() ?: return@mapNotNull null
                      if (y !in 20.0..27.0 || x !in 117.0..124.0) return@mapNotNull null
                      Camera(
                          latitude = y,
                          longitude = x,
                          address = row.getOrNull(addr)?.trim().orEmpty(),
                          direction = row.getOrNull(direction)?.trim().orEmpty(),
                          speedLimit = row.getOrNull(limit)?.trim().orEmpty(),
                      )
                  }.distinctBy { Triple(it.latitude, it.longitude, it.address) }
              }
          
              fun nearest(points: List<Camera>, lat: Double, lon: Double, radiusMeters: Int = 2000): List<Nearby> =
                  points.map { Nearby(it, distanceMeters(lat, lon, it.latitude, it.longitude).roundToInt()) }
                      .filter { it.meters <= radiusMeters }
                      .sortedBy { it.meters }
                      .take(3)
          
              private fun parseRows(content: String): List<List<String>> {
                  val result = mutableListOf<List<String>>()
                  val row = mutableListOf<String>()
                  val cell = StringBuilder()
                  var quoted = false
                  var i = 0
                  while (i < content.length) {
                      when (val c = content[i]) {
                          '"' -> if (quoted && i + 1 < content.length && content[i + 1] == '"') {
                              cell.append('"'); i++
                          } else quoted = !quoted
                          ',' -> if (quoted) cell.append(c) else { row.add(cell.toString()); cell.setLength(0) }
                          '\n' -> if (quoted) cell.append(c) else {
                              row.add(cell.toString().trimEnd('\r')); cell.setLength(0)
                              if (row.any { it.isNotEmpty() }) result.add(row.toList())
                              row.clear()
                          }
                          else -> cell.append(c)
                      }
                      i++
                  }
                  row.add(cell.toString().trimEnd('\r'))
                  if (row.any { it.isNotEmpty() }) result.add(row.toList())
                  return result
              }
          
              private fun distanceMeters(aLat: Double, aLon: Double, bLat: Double, bLon: Double): Double {
                  val latDelta = Math.toRadians(bLat - aLat)
                  val lonDelta = Math.toRadians(bLon - aLon)
                  val h = sin(latDelta / 2).pow(2) + cos(Math.toRadians(aLat)) *
                      cos(Math.toRadians(bLat)) * sin(lonDelta / 2).pow(2)
                  return 6_371_000.0 * 2 * asin(sqrt(h.coerceIn(0.0, 1.0)))
              }
          }
          
          internal object TaiwanGoogleNavHint {
              /** Google Maps notification wording varies by version/language; result is for diagnosis only. */
              fun summarize(raw: String): String {
                  val event = when {
                      listOf("右轉", "turn right").any { raw.contains(it, true) } -> "可能右轉"
                      listOf("左轉", "turn left").any { raw.contains(it, true) } -> "可能左轉"
                      listOf("出口", "exit").any { raw.contains(it, true) } -> "可能出口"
                      listOf("迴轉", "u-turn").any { raw.contains(it, true) } -> "可能迴轉"
                      else -> "無法可靠判斷方向"
                  }
                  val dist = Regex("(\\d+(?:\\.\\d+)?)\\s*(公里|km|公尺|米|m)", RegexOption.IGNORE_CASE).find(raw)
                  val distance = dist?.value ?: "未取得距離"
                  return "$event · $distance（僅供觀察，不是控制指令）"
              }
          }
          TW_PREVIEW_EOF_0
          mkdir -p "app/src/main/java/com/jixiexiaoge/drivingassist"
          cat > 'app/src/main/java/com/jixiexiaoge/drivingassist/TaiwanMapsListener.kt' <<'TW_PREVIEW_EOF_1'
          package com.jixiexiaoge.drivingassist
          
          import android.app.Notification
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          
          /** Read-only Google Maps notification observer. NEVER sends driving/control commands. */
          class TaiwanMapsListener : NotificationListenerService() {
              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  if (sbn?.packageName != GOOGLE_MAPS_PACKAGE) return
                  val extras = sbn.notification.extras
                  val parts = listOfNotNull(
                      extras.getCharSequence(Notification.EXTRA_TITLE)?.toString(),
                      extras.getCharSequence(Notification.EXTRA_TEXT)?.toString(),
                      extras.getCharSequence(Notification.EXTRA_BIG_TEXT)?.toString(),
                      extras.getCharSequence(Notification.EXTRA_SUB_TEXT)?.toString(),
                  ).map(String::trim).filter(String::isNotEmpty).distinct()
                  if (parts.isEmpty()) return
                  getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                      .putString("last_text", parts.joinToString(" | ").take(1500))
                      .putLong("last_time", System.currentTimeMillis())
                      .putBoolean("active", true)
                      .apply()
              }
          
              override fun onNotificationRemoved(sbn: StatusBarNotification?) {
                  if (sbn?.packageName != GOOGLE_MAPS_PACKAGE) return
                  getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                      .putBoolean("active", false)
                      .apply()
              }
          
              companion object {
                  const val PREFS = "taiwan_navigation_preview"
                  const val GOOGLE_MAPS_PACKAGE = "com.google.android.apps.maps"
              }
          }
          TW_PREVIEW_EOF_1
          mkdir -p "app/src/main/java/com/jixiexiaoge/drivingassist"
          cat > 'app/src/main/java/com/jixiexiaoge/drivingassist/TaiwanPreviewActivity.kt' <<'TW_PREVIEW_EOF_2'
          package com.jixiexiaoge.drivingassist
          
          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.io.File
          import java.net.URL
          import kotlin.concurrent.thread
          
          /** Separate TEST launcher. It never calls NaviStreamManager, 7706, 7714, or any control API. */
          class TaiwanPreviewActivity : Activity() {
              private lateinit var report: TextView
              private lateinit var locationManager: LocationManager
              private val uiHandler = Handler(Looper.getMainLooper())
              private var lastLocation: Location? = null
              private var cameras: List<TaiwanCameraCatalog.Camera> = emptyList()
              private var loading = false
              private val locationListener = object : LocationListener {
                  override fun onLocationChanged(location: Location) {
                      lastLocation = location
                      showReport()
                  }
              }
              private val refreshTask = object : Runnable {
                  override fun run() {
                      showReport()
                      uiHandler.postDelayed(this, 2500)
                  }
              }
          
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  locationManager = getSystemService(LOCATION_SERVICE) as LocationManager
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 28, 32, 28)
                  }
                  val title = TextView(this).apply {
                      text = "NaviPilot 台灣導航測試（唯讀）"
                      textSize = 22f
                  }
                  root.addView(title)
                  fun button(label: String, onClick: () -> Unit) {
                      root.addView(Button(this).apply { text = label; setOnClickListener { onClick() } })
                  }
                  button("1. 開啟 Google Maps 通知存取權") {
                      startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                  }
                  button("2. 開啟 Google Maps") {
                      val intent = packageManager.getLaunchIntentForPackage(TaiwanMapsListener.GOOGLE_MAPS_PACKAGE)
                          ?: Intent(Intent.ACTION_VIEW, Uri.parse("https://maps.google.com"))
                      startActivity(intent)
                  }
                  button("3. 啟用 GPS 定位") { requestLocation() }
                  button("4. 下載警政署固定測速點 CSV") { downloadOfficialCsv() }
                  button("5. 若下載失敗，選取 CSV 檔案") {
                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "*/*"
                          putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("text/csv", "text/plain", "application/vnd.ms-excel"))
                      }
                      startActivityForResult(intent, IMPORT_CSV)
                  }
                  button("重新整理資料") { showReport() }
                  report = TextView(this).apply { textSize = 16f; setPadding(0, 20, 0, 20) }
                  root.addView(report)
                  setContentView(ScrollView(this).apply { addView(root) })
                  val file = File(filesDir, FILE_NAME)
                  if (file.exists()) loadCsv(file.readText(), from = "手機先前下載的資料")
                  showReport()
              }
          
              override fun onResume() {
                  super.onResume()
                  uiHandler.post(refreshTask)
              }
          
              override fun onPause() {
                  uiHandler.removeCallbacks(refreshTask)
                  super.onPause()
              }
          
              override fun onDestroy() {
                  runCatching { locationManager.removeUpdates(locationListener) }
                  super.onDestroy()
              }
          
              private fun requestLocation() {
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION), GPS_PERMISSION)
                      return
                  }
                  try {
                      val providers = listOf(LocationManager.GPS_PROVIDER, LocationManager.NETWORK_PROVIDER)
                      providers.filter { locationManager.isProviderEnabled(it) }.forEach {
                          locationManager.requestLocationUpdates(it, 2000L, 5f, locationListener)
                          locationManager.getLastKnownLocation(it)?.let { candidate ->
                              if (lastLocation == null || candidate.time > lastLocation!!.time) lastLocation = candidate
                          }
                      }
                      showReport()
                  } catch (e: SecurityException) {
                      Toast.makeText(this, "定位權限不足", Toast.LENGTH_SHORT).show()
                  } catch (e: IllegalArgumentException) {
                      Toast.makeText(this, "定位提供者不可用", Toast.LENGTH_SHORT).show()
                  }
              }
          
              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == GPS_PERMISSION && grantResults.firstOrNull() == PackageManager.PERMISSION_GRANTED) requestLocation()
              }
          
              @Deprecated("Compatibility with Android document picker")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != IMPORT_CSV || resultCode != RESULT_OK) return
                  val uri = data?.data ?: return
                  try {
                      val content = contentResolver.openInputStream(uri)?.bufferedReader(Charsets.UTF_8)?.use { it.readText() }
                      if (content != null) loadCsv(content, "使用者匯入的 CSV")
                  } catch (e: Exception) { report.text = "讀取 CSV 失敗：${e.javaClass.simpleName}" }
              }
          
              private fun downloadOfficialCsv() {
                  if (loading) return
                  loading = true
                  showReport()
                  thread(name = "TaiwanCameraCsvDownload") {
                      val result = runCatching {
                          val conn = URL(OFFICIAL_CSV).openConnection().apply {
                              connectTimeout = 15000
                              readTimeout = 20000
                          }
                          val data = conn.getInputStream().use { stream ->
                              stream.bufferedReader(Charsets.UTF_8).readText()
                          }
                          if (data.length > 6_000_000) throw IllegalStateException("CSV 檔案過大")
                          data
                      }
                      runOnUiThread {
                          loading = false
                          result.onSuccess { loadCsv(it, "警政署公開 CSV") }
                              .onFailure { report.text = "下載失敗（${it.javaClass.simpleName}）。可從 data.gov.tw/dataset/7320 下載 CSV，再按第 5 項匯入。" }
                      }
                  }
              }
          
              private fun loadCsv(csv: String, from: String) {
                  val parsed = TaiwanCameraCatalog.parseCsv(csv)
                  if (parsed.isEmpty()) {
                      report.text = "未能解析固定測速點。需包含 Latitude、Longitude、Address、direct、limit 欄位。"
                      return
                  }
                  cameras = parsed
                  File(filesDir, FILE_NAME).writeText(csv)
                  Toast.makeText(this, "$from：載入 ${parsed.size} 筆", Toast.LENGTH_LONG).show()
                  showReport()
              }
          
              private fun showReport() {
                  if (!::report.isInitialized) return
                  val prefs = getSharedPreferences(TaiwanMapsListener.PREFS, MODE_PRIVATE)
                  val raw = prefs.getString("last_text", "").orEmpty()
                  val stamp = prefs.getLong("last_time", 0)
                  val elapsed = System.currentTimeMillis() - stamp
                  val fresh = raw.isNotBlank() && elapsed in 0..15_000 && prefs.getBoolean("active", false)
                  val location = lastLocation
                  val cameraText = if (location == null) "尚未取得 GPS 位置" else {
                      val age = System.currentTimeMillis() - location.time
                      if (age !in 0..30_000 || (location.hasAccuracy() && location.accuracy > 100f)) {
                          "GPS 過期或精度不足：不顯示測速點"
                      } else {
                          val nearby = TaiwanCameraCatalog.nearest(cameras, location.latitude, location.longitude)
                          if (nearby.isEmpty()) "目前直線 2 公里內未找到資料庫測速點" else nearby.joinToString("\n") {
                              "約 ${it.meters} m｜速限 ${it.camera.speedLimit.ifBlank { "未知" }}｜${it.camera.address}｜${it.camera.direction}"
                          }
                      }
                  }
                  report.text = """
                      本工具只觀察資料，不向 comma 4 傳送導航／速度／煞車／變道指令。
          
                      Google Maps 通知：${if (fresh) "最近 15 秒有效" else "尚無新鮮資料／通知已移除"}
                      原始文字：${raw.ifBlank { "（請啟動 Google Maps 導航並授權通知存取）" }}
                      解析預覽：${TaiwanGoogleNavHint.summarize(raw)}
          
                      台灣固定測速資料：${cameras.size} 筆 ${if (loading) "（下載中）" else ""}
                      GPS：${location?.let { "${it.latitude}, ${it.longitude}" } ?: "未啟用"}
                      鄰近測速點（僅 GPS 直線距離）：
                      $cameraText
          
                      注意：未驗證行車方向、上下匝道、平面與高架是否同一路線；距離不代表行車距離，也不代表速限正確。這些資料不可直接用於自動減速。
                      資料來源：內政部警政署「測速執法設置點」（data.gov.tw/dataset/7320）；非神盾官方資料。
                  """.trimIndent()
              }
          
              companion object {
                  private const val GPS_PERMISSION = 417
                  private const val IMPORT_CSV = 418
                  private const val FILE_NAME = "taiwan_cameras.csv"
                  private const val OFFICIAL_CSV = "https://opdadm.moi.gov.tw/api/v1/no-auth/resource/api/dataset/EA5E6FCD-B82D-43B7-A5CF-E9893253187E/resource/6D874102-9EB0-4C64-A64C-87A1ACE1D573/download"
              }
          }
          TW_PREVIEW_EOF_2
          mkdir -p "app/src/test/java/com/jixiexiaoge/drivingassist"
          cat > 'app/src/test/java/com/jixiexiaoge/drivingassist/TaiwanPreviewParserTest.kt' <<'TW_PREVIEW_EOF_3'
          package com.jixiexiaoge.drivingassist
          
          import org.junit.Assert.*
          import org.junit.Test
          
          class TaiwanPreviewParserTest {
              @Test fun csvReadsQuotedAddressAndCoordinates() {
                  val csv = "CityName,Longitude,Latitude,Address,direct,limit\n臺南,120.123,23.123,\"省道,靠右\",南向,60\n"
                  val points = TaiwanCameraCatalog.parseCsv(csv)
                  assertEquals(1, points.size)
                  assertEquals("省道,靠右", points[0].address)
                  assertEquals("60", points[0].speedLimit)
              }
          
              @Test fun invalidCoordinatesAreIgnored() {
                  val csv = "Longitude,Latitude,Address\n20,20,invalid\n120.2,23.1,valid\n"
                  assertEquals(1, TaiwanCameraCatalog.parseCsv(csv).size)
              }
          
              @Test fun nearPointsSortByDistance() {
                  val p = listOf(
                      TaiwanCameraCatalog.Camera(23.002, 120.0, "far", "", "60"),
                      TaiwanCameraCatalog.Camera(23.0001, 120.0, "near", "", "50"),
                  )
                  assertEquals("near", TaiwanCameraCatalog.nearest(p, 23.0, 120.0)[0].camera.address)
              }
          
              @Test fun googleHintDoesNotClaimPreciseNavigation() {
                  val hint = TaiwanGoogleNavHint.summarize("500 公尺後右轉")
                  assertTrue(hint.contains("可能右轉"))
                  assertTrue(hint.contains("500 公尺"))
              }
          }
          TW_PREVIEW_EOF_3
          mkdir -p "app/src/debug"
          cat > 'app/src/debug/AndroidManifest.xml' <<'TW_PREVIEW_EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <queries>
                  <package android:name="com.google.android.apps.maps" />
              </queries>
              <!-- This debug variant has NO original app initialization or active Carrot services. -->
              <application android:name="android.app.Application" tools:replace="android:name">
                  <activity android:name="com.jixiexiaoge.drivingassist.MainActivity" android:enabled="false" />
                  <service android:name="com.jixiexiaoge.drivingassist.CarrotAmapForegroundService" android:enabled="false" tools:replace="android:enabled" />
                  <receiver android:name="com.jixiexiaoge.drivingassist.AmapAutoStaticReceiver" android:enabled="false" tools:replace="android:enabled" />
                  <service android:name="com.navipilot.amap2tesla.projection.ProjectionService" android:enabled="false" />
                  <service android:name="com.navipilot.amap2tesla.network.TeslaVirtualIpService" android:enabled="false" />
                  <activity
                      android:name="com.jixiexiaoge.drivingassist.TaiwanPreviewActivity"
                      android:exported="true"
                      android:label="台灣導航測試">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name="com.jixiexiaoge.drivingassist.TaiwanMapsListener"
                      android:label="NaviPilot 台灣導航通知測試"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          TW_PREVIEW_EOF_4
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          t = p.read_text()
          before = 'applicationIdSuffix = ".debug"'
          assert before in t, "原專案 Debug suffix 已變更，停止而非誤改"
          p.write_text(t.replace(before, 'applicationIdSuffix = ".taiwanpreview"', 1))
          PYTHON

      - name: Compile and test preview
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests com.jixiexiaoge.drivingassist.TaiwanPreviewParserTest --no-daemon --stacktrace
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NaviPilot-Taiwan-Preview-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
