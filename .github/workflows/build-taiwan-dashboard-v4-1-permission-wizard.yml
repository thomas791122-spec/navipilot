          (root/'TaiwanGpsQuality.kt').write_text(r'''package com.jixiexiaoge.drivingassist
          
          import android.location.Location
          import android.os.SystemClock
          import java.util.ArrayDeque
          import java.util.Locale
          import kotlin.math.max
          import kotlin.math.roundToInt
          
          /** GPS diagnostics for read-only general navigation testing. No tracking while Activity is in background. */
          internal object TaiwanGpsQuality {
              internal data class Reading(
                  val accepted: Boolean,
                  val stationaryDrift: Boolean,
                  val category: String,
                  val description: String,
              )
              private val history = ArrayDeque<String>()
              private var good = 0
              private var rejected = 0
              private var drift = 0
              private var best = Float.POSITIVE_INFINITY
              private var lastSampleAtMs = 0L
          
              @Synchronized
              fun observe(fix: Location, previous: Location?): Reading {
                  val ageMs = ((SystemClock.elapsedRealtimeNanos() - fix.elapsedRealtimeNanos) / 1000000L)
                      .coerceAtLeast(0L)
                  val accuracy = if (fix.hasAccuracy()) fix.accuracy else Float.POSITIVE_INFINITY
                  var category = when {
                      !accuracy.isFinite() -> "NO_ACCURACY"
                      ageMs > 10000L -> "STALE"
                      accuracy > 40f -> "LOW_ACCURACY"
                      accuracy <= 12f -> "EXCELLENT"
                      accuracy <= 25f -> "GOOD"
                      else -> "FAIR"
                  }
                  var accepted = category == "EXCELLENT" || category == "GOOD" || category == "FAIR"
                  var distance = 0f
                  var stationary = false
                  if (accepted && previous != null) {
                      distance = previous.distanceTo(fix)
                      val seconds = (fix.elapsedRealtimeNanos - previous.elapsedRealtimeNanos) / 1000000000.0
                      if (seconds > 0.1 && seconds < 15.0 && distance / seconds > 55.0) {
                          accepted = false
                          category = "POSITION_JUMP"
                      } else if (fix.hasSpeed() && fix.speed < 1.2f && distance < max(7f, accuracy * 0.7f)) {
                          stationary = true
                          category = "STATIONARY_DRIFT"
                      }
                  }
                  val speed = if (fix.hasSpeed()) "${(fix.speed * 3.6f).roundToInt()} km/h" else "未知"
                  val speedError = if (fix.hasSpeedAccuracy()) "±${(fix.speedAccuracyMetersPerSecond * 3.6f).roundToInt()}" else "未知"
                  val accText = if (accuracy.isFinite()) "${accuracy.roundToInt()}m" else "未知"
                  val grade = when (category) {
                      "EXCELLENT" -> "優良"
                      "GOOD" -> "良好"
                      "FAIR" -> "可觀察"
                      "STATIONARY_DRIFT" -> "靜止防飄移"
                      else -> "不可信"
                  }
                  val msg = "GPS $grade｜誤差 $accText｜${fix.provider ?: "?"}｜延遲 ${ageMs / 1000}s\nGPS 速度 $speed（誤差 $speedError km/h）"
                  if (accepted) {
                      good++
                      best = minOf(best, accuracy)
                      if (stationary) drift++
                  } else rejected++
                  val elapsed = SystemClock.elapsedRealtime()
                  if (elapsed - lastSampleAtMs >= 2000L || lastSampleAtMs == 0L || !accepted) {
                      if (history.size >= 65) history.removeFirst()
                      val clean = String.format(Locale.US, "%02d:%02d:%02d", (System.currentTimeMillis()/3600000)%24,
                          (System.currentTimeMillis()/60000)%60, (System.currentTimeMillis()/1000)%60)
                      history.addLast("$clean $category accuracy=$accText age=${ageMs}ms speed=$speed source=${fix.provider}")
                      lastSampleAtMs = elapsed
                  }
                  return Reading(accepted, stationary, category, msg)
              }
          
              @Synchronized
              fun report(): String = buildString {
                  append("合格樣本：$good，不合格：$rejected，靜止防漂移：$drift\n")
                  append("最佳觀察精度：${if (best.isFinite()) "${best.roundToInt()}m" else "未知"}\n")
                  append("最近事件（不含位置座標，僅供精度診斷）：\n")
                  history.forEach { append(it).append('\n') }
              }
          }
          ''',encoding='utf-8')
          
          (root/'TaiwanOsmSpeedLookup.kt').write_text(r'''package com.jixiexiaoge.drivingassist
          
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.min
          
          /** Manual one-shot public OSM maxspeed check, not map matching or legal speed determination. */
          internal object TaiwanOsmSpeedLookup {
              data class Candidate(val road: String, val limit: String, val meters: Int)
          
              fun findCandidates(lat: Double, lon: Double, gpsAccuracyMeters: Float): List<Candidate> {
                  require(lat in -85.0..85.0 && lon in -180.0..180.0)
                  val query = "[out:json][timeout:12];way(around:75,$lat,$lon)[\"highway\"][\"maxspeed\"];out tags geom;"
                  val payload = "data=" + URLEncoder.encode(query, "UTF-8")
                  val connection = URL("https://overpass.kumi.systems/api/interpreter").openConnection() as HttpURLConnection
                  connection.requestMethod = "POST"
                  connection.connectTimeout = 7000
                  connection.readTimeout = 14000
                  connection.setRequestProperty("Content-Type", "application/x-www-form-urlencoded; charset=UTF-8")
                  connection.setRequestProperty("User-Agent", "NaviPilotTaiwan/3.9-readonly-roadlimit-check")
                  connection.doOutput = true
                  try {
                      connection.outputStream.use { it.write(payload.toByteArray(Charsets.UTF_8)) }
                      if (connection.responseCode != 200) error("OSM HTTP ${connection.responseCode}")
                      val jsonText = connection.inputStream.bufferedReader(Charsets.UTF_8).use { reader ->
                          val txt = reader.readText()
                          require(txt.length <= 2000000) { "OSM response too large" }
                          txt
                      }
                      val data = JSONObject(jsonText).optJSONArray("elements") ?: return emptyList()
                      val results = mutableListOf<Candidate>()
                      for (i in 0 until min(data.length(), 400)) {
                          val element = data.optJSONObject(i) ?: continue
                          val tags = element.optJSONObject("tags") ?: continue
                          val rawLimit = tags.optString("maxspeed").trim()
                          // No guessing based on highway class or routing speed. Non-numeric limits stay unknown.
                          if (!Regex("^[0-9]{1,3}(?:\\s?km/h)?$").matches(rawLimit)) continue
                          val speed = Regex("[0-9]{1,3}").find(rawLimit)?.value ?: continue
                          val name = tags.optString("name").ifBlank { tags.optString("ref").ifBlank { "未命名路段" } }
                          val geometry = element.optJSONArray("geometry") ?: continue
                          var closest = Double.POSITIVE_INFINITY
                          var lastLat: Double? = null
                          var lastLon: Double? = null
                          for (k in 0 until geometry.length()) {
                              val p = geometry.optJSONObject(k) ?: continue
                              val a = p.optDouble("lat", Double.NaN)
                              val b = p.optDouble("lon", Double.NaN)
                              if (!a.isFinite() || !b.isFinite()) continue
                              if (lastLat != null && lastLon != null) {
                                  closest = min(closest, segmentDistance(lat,lon,lastLat,lastLon,a,b))
                              }
                              lastLat = a
                              lastLon = b
                          }
                          if (!closest.isFinite() || closest > maxOf(20.0, gpsAccuracyMeters.toDouble()*2.0)) continue
                          val conditional = tags.optString("maxspeed:conditional").isNotBlank() ||
                              tags.optString("maxspeed:variable").isNotBlank()
                          results.add(Candidate(name.take(40), "$speed km/h" + if (conditional) "（可能有時段／動態限制）" else "", closest.toInt()))
                      }
                      return results.distinctBy { Triple(it.road,it.limit,it.meters/10) }.sortedBy { it.meters }.take(3)
                  } finally { connection.disconnect() }
              }
          
              private fun segmentDistance(lat:Double,lon:Double,aLat:Double,aLon:Double,bLat:Double,bLon:Double):Double {
                  val k = 111320.0 * cos(Math.toRadians(lat))
                  val x1=(aLon-lon)*k;val y1=(aLat-lat)*111320.0
                  val x2=(bLon-lon)*k;val y2=(bLat-lat)*111320.0
                  val dx=x2-x1;val dy=y2-y1
                  val denominator=dx*dx+dy*dy
                  val t=if (denominator < 0.000001) 0.0 else ((-x1*dx-y1*dy)/denominator).coerceIn(0.0,1.0)
                  return hypot(x1+t*dx,y1+t*dy)
              }
          }
          ''',encoding='utf-8')
          
