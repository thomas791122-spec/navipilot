          import android.location.Location
          import android.os.SystemClock
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import kotlin.concurrent.thread
          import kotlin.math.abs
          import kotlin.math.atan2
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.min
          
          /** Cached OSM maxspeed candidates. This is NOT authoritative road map-matching or vehicle control. */
          internal object TaiwanRoadSpeedCache {
              private data class Pt(val lat: Double, val lon: Double)
              private data class Road(val kmh: Int, val pts: List<Pt>)
              private data class Snapshot(val center: Location, val roads: List<Road>, val atMs: Long)
              private data class Scored(val kmh: Int, val meters: Double)
              @Volatile private var cache: Snapshot? = null
              @Volatile private var loading = false
              @Volatile private var lastAttemptMs = 0L
              @Volatile private var nextAllowedMs = 0L
          
              /** null = unknown or ambiguous. Never infer speed from road category. */
              fun match(fix: Location): Int? {
                  if (!fix.hasAccuracy() || fix.accuracy > 25f) return null
                  val now = SystemClock.elapsedRealtime()
                  val age = (SystemClock.elapsedRealtimeNanos() - fix.elapsedRealtimeNanos) / 1_000_000L
                  if (age < 0 || age > 10_000L) return null
                  val snap = cache ?: return null
                  if (now - snap.atMs > 20 * 60_000L || snap.center.distanceTo(fix) > 900f) return null
                  val scored = snap.roads.mapNotNull { road ->
                      if (road.pts.size < 2) return@mapNotNull null
                      var best = Double.POSITIVE_INFINITY
                      for (i in 1 until road.pts.size) {
                          val a = road.pts[i-1]; val b = road.pts[i]
                          val meters = distanceToSegment(fix.latitude, fix.longitude, a, b)
                          if (meters < best) best = meters
                      }
                      if (best > 30.0) null else Scored(road.kmh,best)
                  }.sortedBy { it.meters }
                  val first = scored.firstOrNull() ?: return null
                  val bound = min(22.0, fix.accuracy * 1.25 + 5.0)
                  if (first.meters > bound) return null
                  // Parallel/stacked/adjacent roads with conflicting limits -> don't guess.
                  if (scored.any { it.kmh != first.kmh && it.meters <= maxOf(bound,first.meters + 10.0) }) return null
                  return first.kmh
              }
          
              fun refreshIfNeeded(fix: Location, onReady: () -> Unit) {
                  if (!fix.hasAccuracy() || fix.accuracy > 25f) return
                  val now = SystemClock.elapsedRealtime()
                  val snap = cache
                  if (loading || now < nextAllowedMs) return
                  if (snap != null && snap.center.distanceTo(fix) < 450f && now - snap.atMs < 15 * 60_000L) return
                  if (lastAttemptMs > 0L && now - lastAttemptMs < 180_000L) return
                  loading = true
                  lastAttemptMs = now
                  val snapshotFix = Location(fix)
                  thread(name="NaviPilotOsmSpeedCache") {
                      try {
                          val roads=download(snapshotFix.latitude,snapshotFix.longitude)
                          cache = Snapshot(snapshotFix, roads, SystemClock.elapsedRealtime())
                      } catch (_: Exception) {
                          // Respect public server rate-limits and avoid automatic tight retries.
                          nextAllowedMs=SystemClock.elapsedRealtime()+10*60_000L
                      } finally { loading=false; onReady() }
                  }
              }
          
              private fun download(lat: Double,lon: Double): List<Road> {
                  // One request for nearby road *segments*, then GPS updates are matched locally.
                  val q="[out:json][timeout:16];way(around:650,$lat,$lon)[\"highway\"][\"maxspeed\"];out tags geom;"
                  val body="data=" + URLEncoder.encode(q,"UTF-8")
                  val conn=URL("https://overpass.kumi.systems/api/interpreter").openConnection() as HttpURLConnection
                  conn.requestMethod="POST";conn.connectTimeout=8000;conn.readTimeout=18000
                  conn.setRequestProperty("Content-Type","application/x-www-form-urlencoded; charset=UTF-8")
                  conn.setRequestProperty("User-Agent","NaviPilotTaiwan/4.0-cached-readonly-limits")
                  conn.doOutput=true
                  try {
                      conn.outputStream.use{it.write(body.toByteArray(Charsets.UTF_8))}
                      if(conn.responseCode!=200) throw IllegalStateException("Overpass status ${conn.responseCode}")
                      val content=conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                      require(content.length<2_000_000) { "Response too large" }
                      val array=JSONObject(content).optJSONArray("elements") ?: return emptyList()
                      val roads=ArrayList<Road>()
                      for(i in 0 until min(array.length(),800)) {
                          val el=array.optJSONObject(i) ?: continue
                          val tag=el.optJSONObject("tags") ?: continue
                          if (tag.optString("maxspeed:conditional").isNotBlank() || tag.optString("maxspeed:variable").isNotBlank()) continue
                          val raw=tag.optString("maxspeed").trim()
                          val matcher=Regex("^([0-9]{1,3})(?:\\s?km/h)?$").matchEntire(raw) ?: continue
                          val kmh=matcher.groupValues[1].toIntOrNull() ?: continue
                          if(kmh !in 5..140) continue
                          val geom=el.optJSONArray("geometry") ?: continue
                          val points=ArrayList<Pt>()
                          for(j in 0 until min(geom.length(),500)) {
                              val pt=geom.optJSONObject(j) ?: continue
                              val la=pt.optDouble("lat",Double.NaN);val lo=pt.optDouble("lon",Double.NaN)
                              if(la.isFinite()&&lo.isFinite()) points.add(Pt(la,lo))
                          }
                          if(points.size>=2) roads.add(Road(kmh,points))
                      }
                      return roads
                  } finally {conn.disconnect()}
              }
          
              private fun distanceToSegment(lat:Double,lon:Double,a:Pt,b:Pt):Double {
                  val k=111320.0*cos(Math.toRadians(lat));val x1=(a.lon-lon)*k;val y1=(a.lat-lat)*111320.0
                  val x2=(b.lon-lon)*k;val y2=(b.lat-lat)*111320.0
                  val dx=x2-x1;val dy=y2-y1;val den=dx*dx+dy*dy
                  val t=if(den<=0.000001) 0.0 else ((-x1*dx-y1*dy)/den).coerceIn(0.0,1.0)
                  return hypot(x1+t*dx,y1+t*dy)
              }
          }
          ''',encoding='utf-8')
          
